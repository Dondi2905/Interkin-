<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<meta name="mobile-web-app-capable" content="yes">

<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Interkin</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap">
<style>
/* Layout: terminal-style single column (max 560px), top identity bar, fixed bottom dock with sale action + tabs.
   Palette: cool slate neutrals, signal blue for actions, amber reserved for loyalty points, paper tokens for the 58 mm ticket. */
:root{
  --bg:#F5F8FB; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#0F1A24; --muted:#586878; --line:#D4DBE3;
  --accent:#1F46E0; --accent-ink:#FFFFFF; --accent-soft:#E2E8FC;
  --pts:#9A5200; --pts-soft:#FCEAD2;
  --good:#0D7A4A; --good-soft:#D8F1E4; --bad:#B3261E; --bad-soft:#FBE2DF;
  --paper:#FBFAF6; --paper-ink:#1B1B1B; --paper-line:#C9C6BC;
  --shadow:0 1px 2px rgba(15,26,36,.07),0 6px 18px rgba(15,26,36,.06);
  --font-head:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --dockH:190px;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
.shell{max-width:560px;margin:0 auto}
.main{padding-bottom:var(--dockH)}
[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
.brand{font:700 21px/1 var(--font-head);letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.demo{font:600 10px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--pts);background:var(--pts-soft);padding:4px 6px;border-radius:4px}
.who{font-size:13px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.live{display:inline-flex;align-items:center;gap:5px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.live.off i{background:var(--muted)}

/* headings, cards */
.h{font:600 12px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px}
.sub-h{font:600 13px/1.2 var(--font-body);margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.pts{color:var(--pts);font-weight:600}
.good{color:var(--good)} .bad{color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}

/* buttons, inputs */
.btn{min-height:44px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:disabled{background:var(--surface-2);border-color:var(--line);color:var(--muted);cursor:not-allowed;filter:none}
.btn:disabled{color:var(--muted);cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.on{background:var(--pts-soft);border-color:var(--pts);color:var(--pts)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.big{min-height:52px;padding:12px 20px;font-size:16px}
.inp,.sel{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.inp::placeholder{color:var(--muted)}
.lbl{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;border-radius:7px;min-height:42px;font-weight:500;padding:6px 4px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent);font-weight:600}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 88px 44px;gap:8px;margin-top:8px;align-items:center}
.rrow .btn{padding:0;min-height:46px}
.rblock{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.newing{margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;gap:8px}

/* products */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prod{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:104px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.prod:active{transform:scale(.985)}
.prod .pn{font-weight:600;line-height:1.25;overflow-wrap:anywhere;padding-right:24px}
.prod .pp{font-family:var(--font-head);font-weight:500;font-variant-numeric:tabular-nums}
.stk{font:500 12px/1 var(--font-body);color:var(--muted)}
.stk.low{color:var(--bad);font-weight:600}
.badge{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 13px/24px var(--font-body);text-align:center;padding:0 7px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);width:fit-content;font-variant-numeric:tabular-nums}
.chip.pts{background:var(--pts-soft);color:var(--pts)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

/* lists */
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.rowbtn{width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0;display:flex;align-items:center;gap:10px}
.rowbtn:first-child{border-top:0;padding-top:2px}
.rowbtn:hover{background:var(--surface-2)}
.qty{display:inline-flex;align-items:center;gap:2px}
.qty button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.qty b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.calc{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.calc .l{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.calc .l.t{font-weight:600;font-size:16px}
.note{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--surface-2);color:var(--muted)}
.note + .note{margin-top:8px}
.note.pts{background:var(--pts-soft);color:var(--pts)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.good{background:var(--good-soft);color:var(--good)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.button-kpi,button.kpi{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font:600 20px/1.2 var(--font-head);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpis.three .v{font-size:16px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:0 max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-right,0px))}
.dock-in{max-width:560px;margin:0 auto}
.act{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.act .tl{font-size:12px;color:var(--muted)}
.act .amt{font:700 24px/1.1 var(--font-head);font-variant-numeric:tabular-nums}
.act .why{font-size:12px;color:var(--muted);margin-top:2px}
.nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{background:transparent;border:0;min-height:56px;padding:6px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* modal + pin */
#modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40}
.scrim{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(8,14,20,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
.sheet h3{font-size:20px;margin-bottom:12px}
#vv{position:fixed;top:0;left:0;right:0;bottom:0;z-index:61;background:var(--bg);overflow:auto;padding:6px 12px calc(6px + env(safe-area-inset-bottom))}
#vv .pin-card{display:flex;flex-direction:column;gap:4px;height:100%;max-width:420px;margin:0 auto}
#vv .pin-tag{align-self:center;padding:3px 8px;font-size:10px}
#vv h3{margin:0;font-size:17px;line-height:1.2;text-align:center}
#vv .calc{margin:0;padding:3px 8px;gap:1px;font-size:13px;text-align:left}
#vv .calc .l.t{font-size:14px}
#vv .calc .note{margin:3px 0 0;padding:4px 8px;font-size:12px}
#vv .lbl{margin:0;font-size:12px;text-align:left}
#vv .inp{min-height:36px;padding:4px 10px;font-size:15px}
#vv .dots{margin:0;min-height:14px;gap:10px}
#vv .dots i{width:12px;height:12px}
#vv .pin-msg{min-height:16px;margin:0;font-size:12px}
#vv .keys{flex:1 1 auto;min-height:128px;margin:0;gap:5px;grid-template-rows:repeat(4,minmax(0,1fr))}
#vv .keys button{min-height:0;height:100%;padding:0;font-size:22px}
#vv .keys button.fn{font-size:13px}
#vv .row{margin:0!important}
#vv .calc .l.hl{padding:0 8px;margin:0 -2px;line-height:20px;border-radius:6px;font-weight:700}
#vv .calc .l.rcv{background:var(--accent-soft);color:var(--accent)}
#vv .calc .l.ret{background:var(--good-soft);color:var(--good)}
#vv .btn{min-height:40px}
#vv .btn.wide{margin:0!important;min-height:34px}
#pin{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.pin-card{width:100%;max-width:360px;text-align:center}
.pin-tag{display:inline-block;font:600 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:5px}
.pin-card h3{font-size:22px;margin:14px 0 4px}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);display:block}
.dots i.f{background:var(--ink);border-color:var(--ink)}
.pin-msg{min-height:20px;font-size:13px;color:var(--bad)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.keys button{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:500 24px/1 var(--font-head)}
.keys button.fn{font:500 14px/1 var(--font-body);color:var(--muted)}
.keys button:active{background:var(--accent-soft)}

/* ticket: 32 columns, like a 58 mm thermal roll */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:3px;padding:16px 14px;margin:0 auto;width:fit-content;max-width:100%;overflow-x:auto;box-shadow:var(--shadow)}
.paper pre{margin:0;font:400 13.5px/1.35 var(--font-mono);white-space:pre}
#printArea{display:none}
@media print{
  @page{margin:0}
  html,body{background:#fff!important;margin:0!important;padding:0!important;height:auto!important;min-height:0!important;overflow:visible!important;display:block!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;position:static!important;margin:0!important;padding:0!important;width:100%;background:#fff}
  #printArea .paper{border:0!important;box-shadow:none!important;border-radius:0!important;background:#fff!important;color:#000!important;width:100%!important;max-width:none!important;padding:1mm 5mm 6mm!important;margin:0!important;overflow:visible!important;box-sizing:border-box;position:static!important}
  #printArea .paper img{height:auto!important;margin:0 auto 2mm!important;display:block}
  #printArea .paper pre{font-family:'DejaVu Sans Mono',monospace!important;font-weight:400!important;font-size:7.1pt;font-size:calc((100vw - 10mm) / 20)!important;line-height:1.22!important;color:#000!important;margin:0;white-space:pre}
}

/* login */
.login{max-width:440px;margin:0 auto;padding:32px 0}
.login h1{font-size:34px;letter-spacing:-.02em;margin:10px 0 6px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dockH) + 8px);z-index:80;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.prod:active{transform:none}}
svg.map,svg.chart{width:100%;height:auto;display:block}
svg.map{background:var(--surface-2);border-radius:8px;border:1px solid var(--line)}
</style>
</head>

<script>
/* affiche toute erreur de l'application en bandeau rouge (aide au dépannage) */
(function(){
  function show(m){try{
    var d=document.getElementById('errbar');
    if(!d){d=document.createElement('div');d.id='errbar';d.setAttribute('role','alert');
      d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#B3261E;color:#fff;font:12px/1.35 monospace;padding:8px 10px;white-space:pre-wrap;word-break:break-all';
      d.onclick=function(){d.remove()};document.body.appendChild(d)}
    var ua=(navigator.userAgent.match(/Chrome\/[\d.]+/)||['?'])[0];
    d.textContent='Erreur (touchez pour fermer) : '+m+'\n'+ua}catch(e){}}
  var DBG=false;try{localStorage.removeItem('interkin-debug');DBG=/[?&]debug=1/.test(location.search)}catch(e){}
  var lines=[];window.dbg=function(m){if(!DBG)return;try{
    lines.push(new Date().toLocaleTimeString('fr-FR')+' '+m);if(lines.length>9)lines.shift();
    var d=document.getElementById('dbgbar');
    if(!d){d=document.createElement('div');d.id='dbgbar';d.style.cssText='position:fixed;left:0;bottom:0;z-index:99998;background:rgba(0,0,0,.82);color:#7CFC9A;font:11px/1.3 monospace;padding:4px 6px;pointer-events:none;max-width:100%';document.body.appendChild(d)}
    d.textContent='DIAG '+lines.join('\n');d.style.whiteSpace='pre'}catch(e){}};
  window.dbg('ecran '+innerWidth+'x'+innerHeight+' '+((navigator.userAgent.match(/Chrome\/[\d.]+/)||['?'])[0])+' inset:'+(window.CSS&&CSS.supports?CSS.supports('inset','0'):'?'));
  document.addEventListener('touchstart',function(e){var t=e.touches&&e.touches[0];window.dbg('touch '+(t?Math.round(t.clientX)+','+Math.round(t.clientY):'?'))},true);
  window.addEventListener('error',function(e){show((e.message||'erreur')+(e.lineno?' [ligne '+e.lineno+']':''))});
  window.addEventListener('unhandledrejection',function(e){var r=e.reason;show('promesse : '+((r&&r.message)||r))});
})();
</script>
<script>
/* ---------- stockage local : IndexedDB (grande capacité), repli sur localStorage ---------- */
(function(){
var DBN='interkin-idb',OS='kv',MEM={},db=null,ok=false,lazy={},timer=null,failCb=null,failed=false;
function lsGet(k){try{return localStorage.getItem(k)}catch(e){return null}}
function fail(){failed=true;if(failCb)try{failCb()}catch(e){}}
function open(cb){
  var done=false;function fin(){if(done)return;done=true;clearTimeout(to);cb()}
  var to=setTimeout(fin,4000);
  try{
    if(typeof indexedDB==='undefined'||!indexedDB){fin();return}
    var rq=indexedDB.open(DBN,1);
    rq.onupgradeneeded=function(){try{rq.result.createObjectStore(OS)}catch(e){}};
    rq.onsuccess=function(){
      if(done){try{rq.result.close()}catch(e){}return}
      db=rq.result;
      try{
        var tx=db.transaction(OS,'readonly'),os=tx.objectStore(OS),g=os.getAll(),gk=os.getAllKeys();
        tx.oncomplete=function(){if(done)return;var ks=gk.result,vs=g.result;for(var i=0;i<ks.length;i++)MEM[ks[i]]=vs[i];ok=true;fin()};
        tx.onerror=tx.onabort=function(){db=null;fin()};
      }catch(e){db=null;fin()}
    };
    rq.onerror=rq.onblocked=function(){fin()};
  }catch(e){fin()}
}
function get(k){if(Object.prototype.hasOwnProperty.call(MEM,k))return MEM[k];return lsGet(k)}
function flush(){
  clearTimeout(timer);timer=null;
  var ks=Object.keys(lazy);if(!ks.length)return;
  var vals={};
  ks.forEach(function(k){try{vals[k]=lazy[k]()}catch(e){vals[k]=undefined}});lazy={};
  ks.forEach(function(k){if(vals[k]!==undefined)MEM[k]=vals[k]});
  function viaLS(){ks.forEach(function(k){if(vals[k]===undefined)return;try{localStorage.setItem(k,vals[k])}catch(e){fail()}})}
  if(!ok||!db){viaLS();return}
  try{
    var tx=db.transaction(OS,'readwrite'),os=tx.objectStore(OS);
    ks.forEach(function(k){if(vals[k]!==undefined)os.put(vals[k],k)});
    tx.oncomplete=function(){ks.forEach(function(k){try{localStorage.removeItem(k)}catch(e){}})};
    tx.onerror=tx.onabort=function(){viaLS()};
  }catch(e){viaLS()}
}
function setLazy(k,fn){lazy[k]=fn;if(!timer)timer=setTimeout(flush,250)}
window.KV={open:open,get:get,lazy:setLazy,flush:flush,isIDB:function(){return ok},failed:function(){return failed},onFail:function(f){failCb=f}};
window.__KVBOOT=function(main){open(main)};
window.addEventListener('pagehide',flush);
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='hidden')flush()});
try{if(navigator.storage&&navigator.storage.persist)navigator.storage.persist()}catch(e){}
})();
</script>

function calc(){
  var cust=curCust(),total=cartTotal(),bal=cust?balance(cust.id):0,pu=0;
  if(cust&&U.usePoints&&U.unlocked)pu=Math.max(0,Math.min(r2(parseFloat(String(U.pts).replace(',','.'))||0),total,bal));
  var due=total-pu,paid=r2(parseFloat(String(U.cash).replace(',','.'))||0),change=Math.max(0,r2(paid-due));
  var minCash=due>0?Math.ceil(due/50-1e-9)*50:0;
  var buyer=0,p1=0,p2=0,keep=0;
  if(cust&&pu===0)U.cart.forEach(function(i){buyer+=i.qty*i.b;p1+=i.qty*i.p1;p2+=i.qty*i.p2});
  var ret=0,rest=0,availErr='';
  if(change>0){
    var maxRet=Math.floor(change/100+1e-9)*100,av=(U.avail===''||U.avail==null)?Infinity:Math.max(0,parseFloat(String(U.avail).replace(',','.'))||0),avR=av===Infinity?maxRet:Math.floor(av/100+1e-9)*100;
    if(cust){if(U.keep)keep=change;else{ret=Math.min(maxRet,avR);keep=r2(change-ret)}}
    else{ret=maxRet;rest=r2(change-maxRet);if(avR<maxRet)availErr='Client sans compte : il faut rendre toute la monnaie ('+fmt(maxRet)+' FC).'}
  }
  var s1=cust?sponsorOf(cust):null,s2=s1?sponsorOf(s1):null,err='';
  if(!U.cart.length)err='Le panier est vide.';
  else if(U.client===undefined)err='Choisissez un client ou « Sans compte ».';
  else if(paid<due)err='Il manque '+fmt(due-paid)+' FC (minimum à donner : '+fmt(minCash)+' FC).';
  else if(Math.abs(paid/50-Math.round(paid/50))>1e-9)err='Les espèces doivent être un multiple de 50 FC (minimum : '+fmt(minCash)+' FC).';
  return {minCash:minCash,cust:cust,total:total,bal:bal,pu:pu,due:due,paid:paid,change:change,keep:keep,ret:ret,rest:rest,availErr:availErr,buyer:buyer,p1:p1,p2:p2,s1:s1,s2:s2,err:err,earned:buyer+keep};
}

var liveChk=false;

function doFinalize(res){

  if(res&&Math.abs(c.pu-res.pu)>0.004){Sync.rpc('release_points',{p_lid:res.lid}).catch(function(){});toast('Le montant a changé, validez de nouveau.','bad');render();return}
  if(c.pu>0&&!U.online){toast('Hors ligne : points indisponibles.','bad');return}
  var user=U.user,cust=c.cust,pdv=user.pdvId,no=nextNo(pdv),cogs=0,UU=saleUses(U.cart,pdv);
  U.cart.forEach(function(i){cogs+=(i.cost||0)*i.qty});
  var sale={id:res?res.sid:'s'+nid(),no:no,ts:Date.now(),pdvId:pdv,role:user.role,sellerId:user.id,sellerName:whoName(user),custId:cust?cust.id:null,custName:cust?cust.name:null,
    items:U.cart.map(function(i,ix){return {id:i.id,name:i.name,price:i.price,qty:i.qty,cost:i.cost||0,use:UU[ix]}}),
    total:c.total,pointsUsed:c.pu,cashDue:c.due,cashPaid:c.paid,change:c.change,kept:c.keep,ret:c.ret,
    cashNet:c.paid-c.ret,earned:0,balanceAfter:null,cogs:cogs,profit:c.total-cogs,offline:!U.online,pending:!U.online};
  if(cust){
    var tk=' — ticket N° '+pad(no);
    if(c.pu>0){addLedger(cust.id,'spend',-c.pu,'Points utilisés'+tk,sale.id);if(res){var LR=S.ledger[S.ledger.length-1];LR.id=res.lid;LR.ts=res.ts;LR.note=res.note}}
    if(c.keep>0)addLedger(cust.id,'earn_change',c.keep,'Monnaie transformée en points'+tk,sale.id);
    if(c.pu===0){
      if(c.buyer>0)addLedger(cust.id,'earn_purchase',c.buyer,'Points gagnés à l’achat'+tk,sale.id);
      if(c.p1>0){
        if(c.s1)addLedger(c.s1.id,'earn_sponsor1',c.p1,'Parrain direct, achat de '+cust.name+tk,sale.id);
        else addLedger('E','earn_sponsor1',c.p1,'Non attribué : '+cust.name+' n’a pas de parrain direct'+tk,sale.id);
      }
      if(c.p2>0){
        if(c.s2)addLedger(c.s2.id,'earn_sponsor2',c.p2,'Parrain 2, achat de '+cust.name+tk,sale.id);
        else addLedger('E','earn_sponsor2',c.p2,'Non attribué : '+cust.name+' n’a pas de parrain 2'+tk,sale.id);

  U.cart.forEach(function(i,ix){
    var p=prodById(i.id);if(!p)return;
    var s=st(p,pdv);if(s!==null)p.stock[pdv]=Math.max(0,s-i.qty);
    sale.items[ix].use.forEach(function(r){var g=ingById(r.ing);if(!g)return;var q=ist(g,pdv);if(!q)return;var u=r6(i.qty*r.q);q.cur=r6(q.cur-u);q.used=r6(q.used+u)});

  S.sales.unshift(sale);logEv('sale','Vente N° '+pad(no)+' : '+fmt(sale.total)+' FC');save();resetSale();
  U.tab='sale';render();showTicket(sale,true);
}
function packBags(tiers,qty,pdv){
  var t=tiers.filter(function(x){return x.up>0}).sort(function(a,b){return a.up-b.up});
  if(!t.length||!(qty>0))return [];
  if(pdv&&t.length>1){var av=t.filter(function(x){var g=ingById(x.ing),q=g&&ist(g,pdv);return !q||q.cur>0});if(av.length&&av.length<t.length)t=av}
  var L=t[t.length-1],full=Math.floor(qty/L.up),rem=qty-full*L.up,bags={};
  if(full)bags[L.ing]=full;
  if(rem>0){var x=t.find(function(y){return rem<=y.up});bags[x.ing]=(bags[x.ing]||0)+1}
  return Object.keys(bags).map(function(k){return {ing:k,bags:bags[k]}});
}
function lineUse(pr){return ((pr&&pr.recipe)||[]).map(function(r){return {ing:r.ing,q:r.g}})}
/* l'emballage se calcule sur le total de pains de la vente, tous parfums confondus (produits ayant les mêmes paliers) */
function saleUses(cart,pdv){
  var uses=cart.map(function(i){return lineUse(prodById(i.id))}),gr={};
  cart.forEach(function(i,ix){var pr=prodById(i.id),pk=(pr&&pr.pack)||[];if(!pk.length)return;
    if((pr.recipe||[]).some(function(r){var g=ingById(r.ing);return g&&g.pack&&g.pack.length}))return; /* l’emballage de l’intrant prime : pas de double décompte */
    var key=JSON.stringify(pk.map(function(x){return [x.ing,x.up]}).sort()),g=gr[key]=gr[key]||{tiers:pk,qty:0,first:ix};g.qty+=i.qty});
  var ig={};
  cart.forEach(function(i,ix){uses[ix].forEach(function(u){var g=ingById(u.ing);if(!g||!(g.pack&&g.pack.length))return;
    var o=ig[g.id]=ig[g.id]||{g:g,qty:0,first:ix,fq:i.qty};o.qty+=i.qty*u.q})});
  Object.keys(ig).forEach(function(k){var o=ig[k];
    packBags(o.g.pack,Math.ceil(o.qty-1e-9),pdv).forEach(function(b){uses[o.first].push({ing:b.ing,q:r6(b.bags/o.fq)})})});
  Object.keys(gr).forEach(function(k){var g=gr[k],fq=cart[g.first].qty;
    packBags(g.tiers,g.qty,pdv).forEach(function(b){uses[g.first].push({ing:b.ing,q:r6(b.bags/fq)})})});
  return uses;
}
function stockKeys(items,pdv){var k=[];items.forEach(function(i){k.push('stock/p:'+i.id+':'+pdv);var pr=prodById(i.id),L=((pr&&pr.recipe||[]).concat((pr&&pr.pack)||[])).concat(pr?[]:(i.use||[]).map(function(u){return {ing:u.ing}}));
    (pr&&pr.recipe||[]).forEach(function(r){var g=ingById(r.ing);if(g&&g.pack)L=L.concat(g.pack)});
    L.forEach(function(r){k.push('istock/i:'+r.ing+':'+pdv)})});return k}
function resetSale(){U.avail='';U.refuse='';U.cart=[];U.client=undefined;U.cq='';U.usePoints=false;U.unlocked=false;U.pts='';U.cash='';U.keep=false}

function breakdown(id){
  var b={buy:0,sp:0,chg:0,used:0,total:0};
  S.ledger.forEach(function(l){if(l.acc!==id)return;b.total+=l.pts;
    if(l.type==='earn_purchase'||l.type==='initial')b.buy+=l.pts;
    else if(l.type==='earn_sponsor1'||l.type==='earn_sponsor2')b.sp+=l.pts;
    else if(l.type==='earn_change')b.chg+=l.pts;else if(l.type==='spend')b.used+=-l.pts;
    else if(l.type==='cancel'){var o=l.of;if(o==='earn_purchase'||o==='initial')b.buy+=l.pts;else if(o==='earn_sponsor1'||o==='earn_sponsor2')b.sp+=l.pts;else if(o==='earn_change')b.chg+=l.pts;else if(o==='spend')b.used+=-l.pts}});
  return b;
}

/* périodes et totaux */
function periodStart(per){
  var d=new Date();d.setHours(0,0,0,0);
  if(per==='today')return d.getTime();
  if(per==='week'){d.setDate(d.getDate()-((d.getDay()+6)%7));return d.getTime()}
  if(per==='month'){d.setDate(1);return d.getTime()}
  return 0;
}

}

  list.forEach(function(s){r.total+=s.total;r.disc+=s.pointsUsed;r.cash+=s.cashNet;r.earned+=s.earned;r.kept+=s.kept;r.cogs+=s.cogs||0;r.profit+=profitOf(s)});

var W=32;
function ticketLines(s){
  var center=function(t){t=String(t).slice(0,W);return ' '.repeat(Math.floor((W-t.length)/2))+t};
  var lr=function(l,r){l=String(l);r=String(r);var g=W-l.length-r.length;return g>=1?l+' '.repeat(g)+r:l.slice(0,Math.max(0,W-r.length-1))+' '+r};
  var rule='-'.repeat(W),pdv=pdvById(s.pdvId),L=[];
  var br=brand();
  if(String(br.name||'').trim())L.push(center(String(br.name).trim()));

function processLogo(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){cb(null)};
  fr.onload=function(){var im=new Image();
    im.onerror=function(){cb(null)};
    im.onload=function(){
      var w=Math.min(384,im.width),h=Math.round(im.height*w/im.width);
      if(h>240){w=Math.max(1,Math.round(w*240/h));h=240}
      var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      var d=x.getImageData(0,0,w,h),a=d.data,g=new Float32Array(w*h),i,xx,yy;
      for(i=0;i<w*h;i++)g[i]=0.299*a[i*4]+0.587*a[i*4+1]+0.114*a[i*4+2];
      for(yy=0;yy<h;yy++)for(xx=0;xx<w;xx++){i=yy*w+xx;var o=g[i],nv=o<128?0:255,er=o-nv;g[i]=nv;
        if(xx+1<w)g[i+1]+=er*7/16;if(yy+1<h){if(xx>0)g[i+w-1]+=er*3/16;g[i+w]+=er*5/16;if(xx+1<w)g[i+w+1]+=er/16}}
      for(i=0;i<w*h;i++){var v=g[i]<128?0:255;a[i*4]=a[i*4+1]=a[i*4+2]=v;a[i*4+3]=255}
      x.putImageData(d,0,0);cb(c.toDataURL('image/png'),w,h)};
    im.src=fr.result};
  fr.readAsDataURL(file);
}

function pinKey(v){
  if(!P)return;
  if(v==='cancel'){var cb=P.onCancel;P=null;renderPin();if(cb)cb();return}
  if(v==='del'){P.digits=P.digits.slice(0,-1);P.msg='';renderPin();return}
  if(P.digits.length>=4)return;
  P.digits+=v;renderPin();
  if(P.digits.length===4)setTimeout(pinSubmit,140);
}
function pinSubmit(){
  if(!P)return;var pin=P.digits;
  if(P.mode==='verify'){
    if(P.verify(pin)){var ok=P.onOk;P=null;renderPin();ok(pin)}
    else{P.tries++;P.digits='';
      if(P.tries>=3){var cb=P.onCancel;P=null;renderPin();toast('Trop d’essais. Utilisation des points annulée.');if(cb)cb();return}
      P.msg='Code incorrect. '+(3-P.tries)+' essai(s) restant(s).';renderPin()}
  }else{
    if(P.step===1){P.first=pin;P.step=2;P.digits='';P.msg='';renderPin()}
    else if(pin===P.first){var ok2=P.onOk;P=null;renderPin();ok2(pin)}
    else{P.step=1;P.first='';P.digits='';P.msg='Les deux codes sont différents. Recommencez.';renderPin()}
  }
}

function mergeDuplicates(){
  if(SYNC_ON&&Sync.role()!=='owner')return 0;
  var g={},n=0;S.merges=S.merges||[];
  S.customers.forEach(function(c){var k=digits(c.phone).slice(-9);if(k.length>=9)(g[k]=g[k]||[]).push(c)});
  Object.keys(g).forEach(function(k){var l=g[k];if(l.length<2)return;
    l.sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0)});var keep=l[0];
    l.slice(1).forEach(function(d){
      var moved=0;S.ledger.forEach(function(x){if(x.acc===d.id){x.acc=keep.id;moved+=x.pts}});
      S.sales.forEach(function(x){if(x.custId===d.id){x.custId=keep.id;x.custName=keep.name}});
      S.customers.forEach(function(x){if(x.sponsorId===d.id)x.sponsorId=(x.id===keep.id?null:keep.id)});
      S.resets.forEach(function(x){if(x.custId===d.id)x.custId=keep.id});
      if(!keep.sponsorId&&d.sponsorId&&d.sponsorId!==keep.id)keep.sponsorId=d.sponsorId;
      S.customers=S.customers.filter(function(x){return x!==d});
      S.merges.unshift({ts:Date.now(),kept:keep.name,dup:d.name,phone:keep.phone,pts:moved});n++});
  });
  if(n)save();
  return n;
}

function newUnit(mode,label){return mode==='nombre'?((label||'').trim()||'unités'):mode==='ml'?'ml':mode==='kg'?'kg':'g'}
function rowUnit(r){return r.ing==='__new'?newUnit(r.nu,r.nl):unit(ingById(r.ing))}
function rowHint(r){

  var N=Math.max(1,parseInt(M.batch,10)||1),per=r.mode==='l'?q/N:q,u=rowUnit(r);
  return (r.mode==='l'?'Soit '+qn(per,4)+' '+u+' par unité vendue (lot de '+N+'). ':'')+'Jusqu’à '+qn(per*(1+S.margin/100),4)+' '+u+' par unité vendue avec la marge de '+S.margin+' %.';

function dkey(ts){var d=new Date(ts),m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j}
function consumption(list){
  var m={};
  list.forEach(function(s){(s.items||[]).forEach(function(it){
    var use=it.use;
    if(!use){var pr=S.products.filter(function(p){return p.id===it.id||p.name===it.name})[0];use=((pr&&pr.recipe)||[]).map(function(r){return {ing:r.ing,q:r.g}})}
    use.forEach(function(u){m[u.ing]=r6((m[u.ing]||0)+u.q*it.qty)})})});
  return m;
}
function consoRange(day,per){
  var p=day.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);d.setHours(0,0,0,0);var a=new Date(d),b=new Date(d);
  if(per==='week'){a.setDate(a.getDate()-((a.getDay()+6)%7));b=new Date(a);b.setDate(b.getDate()+7)}
  else if(per==='month'){a.setDate(1);b=new Date(a);b.setMonth(b.getMonth()+1)}
  else b.setDate(b.getDate()+1);
  return {a:a.getTime(),b:b.getTime()};
}

function consRows(m){var r=S.ingredients.filter(function(g){return m[g.id]>0}).map(function(g){return '<div class="item"><div class="grow">'+esc(g.name)+'</div><b class="num">'+qf(g,m[g.id])+'</b></div>'}).join('');return r||'<div class="hint" style="margin-top:8px">Aucun intrant consommé.</div>'}

function svcDetail(h,l){
  var cm=consumption(l),rows=(h.sc&&h.sc.rows)||[],open=!h.closeTs,pdv=h.pdvId,out='';
  var rI={},rP={};rows.forEach(function(r){if(r.kind==='p')rP[r.ing]=r;else rI[r.ing]=r});
  var ids=Object.keys(cm).filter(function(k){return cm[k]>0});Object.keys(rI).forEach(function(k){if(ids.indexOf(k)<0)ids.push(k)});
  var iRows=ids.map(function(id){var g=ingById(id);if(!g)return '';var c=cm[id]||0,r=rI[id],en='',cp='';
    if(r){var exp=r6(r.cnt-r.diff),w=r.strict?0:r6((r.theo||0)*mgOf(g)/100);
      en='Attendu à la fin : <b>'+(w>0?qf(g,Math.max(0,r6(exp-w)))+' à '+qf(g,r6(exp+w)):qf(g,exp))+'</b>';
      cp='Compté : <b class="'+(r.ok?'good':'bad')+'">'+qf(g,r.cnt)+'</b> · '+(r.strict?uTxt(r.diff):eTxt({strict:false,diff:r.diff,pct:r.pct,u:unit(g),g:g}))}

  var sold={};l.forEach(function(x){(x.items||[]).forEach(function(it){sold[it.id]=(sold[it.id]||0)+it.qty})});
  var pr=Object.keys(sold).map(function(id){return S.products.filter(function(p){return p.id===id})[0]}).filter(function(p){return p&&st(p,pdv)!==null});

  return out}

function debtAlloc(){

  Object.keys(by).forEach(function(uid){var rem=0;(S.repays||[]).forEach(function(r){if(r.uid===uid)rem+=r.amount});
    by[uid].sort(function(a,b){return a.closeTs-b.closeTs}).forEach(function(h){var m=-h.diff,pd=Math.min(m,rem);rem=r2(rem-pd);al[h.id]={paid:r2(pd),left:r2(m-pd)}})});
  return al}

function waterReport(){

function waterByShift(t0,cw){
  var sh=S.shifts.filter(function(h){return h.openTs>=t0}).sort(function(a,b){return b.openTs-a.openTs}),by={},free=[];
  S.ingredients.forEach(function(g){var f=unit(g)==='kg'?1:(unit(g)==='g'||unit(g)==='ml')?0.001:0;if(!f)return;(g.draws||[]).forEach(function(x){if(x.ts<t0-4*3600000)return;
    var c=sh.filter(function(h){return h.pdvId===x.pdv}),best=null,bd=1e18;
    c.forEach(function(h){var e=h.closeTs||Date.now();if(x.ts>=h.openTs&&x.ts<=e){best=h;bd=-1}else if(bd>=0){var d=Math.abs(h.openTs-x.ts);if(d<bd&&d<=4*3600000){best=h;bd=d}}});
    if(best){var o=by[best.id]=by[best.id]||{dr:0,net:0};o.dr+=x.dr*f;o.net+=x.net*f}else if(x.ts>=t0)free.push(x)})});
  if(!sh.length&&!Object.keys(by).length)return '';
  var k=function(x){return qn(x,1)};

     +'<div class="small num muted">'+(o?'Tasses puisé '+k(o.dr)+' · après ébullition '+k(o.net)+' · perdu '+k(o.dr-o.net):'Eau des tasses non saisie')+(cw?' · nettoyage '+k(cw):'')+'</div>'
     +'<div class="num"><b>Total puisé '+k(tot)+' kg</b></div></div>'}).join('');
  var days={};sh.forEach(function(h){var key=dstr(h.openTs)+'|'+h.pdvId,o=by[h.id],d=days[key]=days[key]||{day:dstr(h.openTs),pdv:h.pdvId,n:0,t:0};d.n++;d.t+=(o?o.dr:0)+cw});
  var drows=Object.keys(days).slice(0,10).map(function(key){var d=days[key],pd=pdvById(d.pdv);return '<div class="item"><div class="grow">'+d.day+' · '+esc(pd?pd.name:'?')+' <span class="muted small">('+d.n+' service'+(d.n>1?'s':'')+')</span></div><b class="num">'+k(d.t)+' kg</b></div>'}).join('');
  return '<div class="sub-h" style="margin-top:14px">Eau puisée par service</div><div class="card">'+rows+'</div>'
   +'<div class="sub-h" style="margin-top:14px">Total par jour et point de vente</div><div class="card">'+drows+'</div>'}
function payInfo(uid,per){
  var t0=periodStart(per),ca=0,mq=0,ns=0,all=0,rp=0;
  live(S.sales).forEach(function(x){if(x.sellerId===uid&&x.ts>=t0)ca+=x.total});
  S.shifts.forEach(function(h){if(h.uid!==uid||h.state!=='closed'||h.diff==null||!(h.diff<0))return;all+=-h.diff;if(h.closeTs>=t0){mq+=-h.diff;ns++}});
  (S.repays||[]).forEach(function(r){if(r.uid===uid)rp+=r.amount});
  var al=debtAlloc(),left=0;S.shifts.forEach(function(h){if(h.uid===uid&&h.state==='closed'&&h.diff<0&&h.closeTs>=t0)left+=(al[h.id]?al[h.id].left:-h.diff)});left=Math.round(left);mq=Math.round(mq);var paid=Math.max(0,mq-left);
  var base=Math.max(0,Math.round(ca-left)),cu=S.rates&&S.rates[uid]!=null,rate=cu?S.rates[uid]:(S.rateAll||0);
  return {ca:ca,mq:mq,ns:ns,left:left,paid:paid,base:base,rate:rate,custom:cu,rem:Math.round(base*rate/100),debt:Math.round(all-rp),rp:rp}
}

function pwField(id,ac,num){return '<div class="row"><input id="'+id+'" type="password" class="inp grow" autocomplete="'+(ac||'off')+'"'+(num?' inputmode="numeric" pattern="[0-9]*"':'')+'>'+(num?'<button type="button" class="btn" data-a="pwkb" data-t="'+id+'" aria-label="Changer de clavier">ABC</button>':'')+'<button type="button" class="btn" data-a="showpw" data-t="'+id+'" aria-label="Afficher ou masquer le mot de passe">Afficher</button></div>'}
function whoName(u){return u.role==='owner'?'Propriétaire':u.name}
function logEv(type,txt){S.log.unshift({ts:Date.now(),uid:U.user?U.user.id:null,name:U.user?whoName(U.user):'Système',pdvId:U.user?U.user.pdvId:null,type:type,txt:txt});if(S.log.length>600)S.log.length=600}
function userById(id){return S.users.find(function(u){return u.id===id})||null}
function openShift(uid){return S.shifts.find(function(h){return h.uid===uid&&h.state==='open'})||null}
function shiftEnd(h){return h.closeTs||Date.now()}
function shiftSales(h){return live(S.sales).filter(function(x){return x.sellerId===h.uid&&x.ts>=h.openTs&&x.ts<=shiftEnd(h)})}
function shiftWd(h){return S.withdrawals.filter(function(w){return w.pdvId===h.pdvId&&w.ts>=h.openTs&&w.ts<=shiftEnd(h)})}
function expectedCash(h){var c=h.float;shiftSales(h).forEach(function(x){c+=x.cashNet});shiftWd(h).forEach(function(w){c-=w.amount});return r2(c)}
function suggestedFloat(pdv){
  var f=S.floats[pdv],last=S.shifts.filter(function(h){return h.pdvId===pdv&&h.state==='closed'}).sort(function(a,b){return b.closeTs-a.closeTs})[0];
  var since=last?last.closeTs:0;
  if(f&&f.ts>=since)return f.amount;
  var base=last?(last.counted!=null?last.counted:last.expected):0,w=0;
  S.withdrawals.forEach(function(x){if(x.pdvId===pdv&&x.ts>since)w+=x.amount});
  return Math.max(0,r2(base-w));
}

function scCalcP(h,p,cnt){
  var T=h.closeTs||Date.now(),ls=0,la=0;
  S.sales.forEach(function(x){if(x.pdvId!==h.pdvId||x.cancelled||x.ts<=T)return;(x.items||[]).forEach(function(it){if(it.id===p.id)ls+=it.qty})});
  S.moves.forEach(function(m){if(m.kind==='p'&&m.id===p.id&&m.pdv===h.pdvId&&m.ts>T)la+=m.qty});
  var exp=(st(p,h.pdvId)||0)+ls-la,diff=cnt-exp;
  return {kind:'p',p:p,cnt:cnt,exp:exp,diff:diff,ok:diff===0,ls:ls,la:la};
}
function scChip(r){
  if(r.kind==='p')return '<span class="chip '+(r.ok?'good':'bad')+'">'+(r.ok?'Juste':(r.diff<0?'Manque ':'Excédent +')+Math.abs(r.diff)+' unité'+(Math.abs(r.diff)>1?'s':''))+'</span>';
  return '<span class="chip '+(r.ok?'good':'bad')+'">'+eTxt(r)+'</span>';

function scCalc(h,g,cnt){
  var s=ensureIng(g,h.pdvId),T=h.closeTs||Date.now(),lu=0,la=0;
  S.sales.forEach(function(x){if(x.pdvId!==h.pdvId||x.cancelled||x.ts<=T)return;(x.items||[]).forEach(function(it){(it.use||[]).forEach(function(u){if(u.ing===g.id)lu+=it.qty*u.q})})});
  S.moves.forEach(function(m){if(m.kind==='i'&&m.id===g.id&&m.pdv===h.pdvId&&m.ts>T)la+=m.qty});
  lu=r6(lu);la=r6(la);
  var fx=(wOf(g)&&wOf(g).fx)||0,theo=r6(s.used-lu+fx),added=r6(s.added-la),actual=r6(s.open+added-cnt),dev=actual-theo;
  var E=eCalc(g,theo,actual);
  return {g:g,cnt:cnt,theo:theo,actual:actual,pct:E.pct,ok:E.ok,strict:E.strict,diff:E.diff,lu:lu,la:la};
}

function finishShift(h,counted,forced){
  h.closeTs=Date.now();h.expected=expectedCash(h);h.counted=forced?null:counted;h.diff=forced?null:r2(counted-h.expected);h.forced=!!forced;h.state='closed';if(scList(h).length||scProds(h).length)h.sc={st:'p'};

function liveCashInner(){
  var open=S.shifts.filter(function(h){return h.state==='open'}),T={f:0,i:0,o:0,e:0};

    if(Date.now()<f.until){toast('Trop d’essais. Réessayez dans '+Math.ceil((f.until-Date.now())/60000)+' min.');return}
    if(SYNC_ON){
      if(!ph||!pw){toast('Saisissez votre numéro et votre mot de passe.');return}
      var btn=e&&e.target.closest('button');if(btn){if(btn.disabled)return;btn.disabled=true;btn.textContent='Connexion…'}
      var lp=$('#lpdv');if(lp)U.lpdv=lp.value;
      Sync.login(ph,pw).then(function(r){U.fails[ph]=null;return Sync.first(r).then(function(){return r})}).then(function(r){
        var u=userById(r.user.id);if(!u){u=r.user;S.users.push(u)}
        if(u.role==='owner'&&!S.pdvs.some(function(p){return p.id===U.lpdv}))U.lpdv=S.pdvs[0]?S.pdvs[0].id:null;
        startSession(u);

        if(er&&er.status===400){f.n++;if(f.n>=5){f.until=Date.now()+300000;f.n=0}U.fails[ph]=f}
        if(er&&er.halt)return;
        if(er&&er.locked){openModal('<h3>Compte verrouillé</h3><p class="muted">Le propriétaire a verrouillé votre compte. Envoyez-lui une demande : vous pourrez vous reconnecter dès qu’il l’aura autorisée.</p><div class="row" style="margin-top:14px"><button class="btn grow" data-a="closeModal">Fermer</button><button class="btn primary grow" data-a="askUnlock">Demander l’autorisation</button></div>');return}
        toast(Sync.msg(er),'bad');
      }).then(function(){var b2=$('[data-a=login]');if(b2){b2.disabled=false;b2.textContent='Ouvrir la session'}});
      return;
    }
    var u=S.users.find(function(x){return x.phone===ph});

  saveMulti:function(d){

      else{var s=ensureIng(o,pdv);if(set){s.open=q;s.cur=q;s.added=0;s.used=0}else{s.cur=r6(s.cur+q);s.added=r6(s.added+q)}}

  saveProd:function(d){

    M.recipe.forEach(function(r){
      if(r.ing!=='__new')return;
      var nm=r.nn.trim(),ex=S.ingredients.find(function(g){return norm(g.name)===norm(nm)});
      if(ex){r.ing=ex.id;return}
      var ni={id:'i'+nid(),name:nm,unit:newUnit(r.nu,r.nl),stock:{}};

    var pack=M.pack.map(function(x){return {ing:x.ing,up:parseInt(x.up,10)}}).filter(function(x){return x.up>0});
    if(M.pack.length&&pack.length!==M.pack.length){toast('Indiquez « jusqu’à » combien d’unités pour chaque emballage.');return}
    if(new Set(pack.map(function(x){return x.up})).size!==pack.length){toast('Deux emballages ont la même limite.');return}

    if(d.id){var p=prodById(d.id);var oldP=p.price;Object.assign(p,{name:name,price:price,cost:cost,b:b,p1:p1,p2:p2,recipe:recipe});if(pack.length)p.pack=pack;else delete p.pack;if(usesLot)p.batch=N;else delete p.batch}

      var np={id:'r'+nid(),name:name,price:price,cost:cost,b:b,p1:p1,p2:p2,stock:stock,recipe:recipe};if(pack.length)np.pack=pack;if(usesLot)np.batch=N;S.products.push(np);
    }

    if(!a.rt)return Promise.reject(nerr('Session expirée',401));
    if(!refreshing)refreshing=http('POST','/auth/v1/token?grant_type=refresh_token',{refresh_token:a.rt},null,true)
      .then(function(j){refreshing=null;setTok(j)},function(e){refreshing=null;if(e.status>=400&&e.status<500)e.expired=true;throw e});
    return refreshing;
  }
  function call(method,path,body,hdr){
    return ensureTok().then(function(){return http(method,path,body,hdr)}).catch(function(e){
      if(e.status===401&&!e.expired&&ST.auth&&!e.retried){ST.auth.exp=0;e.retried=1;return ensureTok().then(function(){return http(method,path,body,hdr)})}
      throw e});
  }
  function msg(e){
    if(!e)return 'Erreur.';if(!e.status)return 'Connexion internet requise.';
    var m=e.message||'Erreur.';return m.replace(/^.*Réservé/,'Réservé');
  }
  function setNet(on){
    if(U.online!==on){U.online=on;if(!on&&U.usePoints){U.usePoints=false;U.unlocked=false;U.pts=''}
      var el=$('#net');if(el)el.innerHTML=netHTML();if(U.user&&U.tab==='sale'&&$('#payBox'))refreshPay()}
    else{var el2=$('#net');if(el2)el2.innerHTML=netHTML()}
  }
  function toUser(p){return {id:p.id,name:p.name,phone:p.phone,role:p.role,shift:p.shift||undefined,pdvId:p.pdv_id||null,locked:!!p.locked,unlockReq:p.unlock_req||null}}

  /* ----- connexion ----- */
  function login(phone,pw){
    api.catDone=false;
    return http('POST','/auth/v1/token?grant_type=password',{email:phone+'@interkin.app',password:pw},null,true).then(function(j){
      ST.auth={uid:j.user.id,phone:phone,at:j.access_token,rt:j.refresh_token,exp:Date.now()+(j.expires_in||3600)*1000,epoch:0,profile:null};
      return call('GET','/rest/v1/profiles?id=eq.'+j.user.id+'&select=*');
    }).then(function(rows){
      var p=rows&&rows[0];if(!p||!p.active)throw nerr('Ce compte est désactivé.',403);
      if(p.locked){ST.lk=ST.lk||{};ST.lk[phone]=1;ST.auth=null;writeSt();var le=nerr('Compte verrouillé par le propriétaire.',423);le.locked=true;throw le}
      if(ST.lk)delete ST.lk[phone];
      ST.auth.profile=p;
      if(p.role==='seller')return call('POST','/rest/v1/rpc/claim_session',{}).then(function(e){ST.auth.epoch=e;return p});
      ST.auth.epoch=p.epoch;return p;
    }).then(function(p){
      ST.creds[phone]={h:hashPw(pw,'dev'),num:/^\d{4,12}$/.test(pw),uid:ST.auth.uid,rt:ST.auth.rt,epoch:ST.auth.epoch,profile:p};writeSt();
      return {user:toUser(p),online:true};
    },function(e){
      if(e.locked)throw e;
      if(!e.status)return offlineLogin(phone,pw);
      ST.auth=null;
      if(e.status===400||e.status===401||e.status===422)throw nerr('Numéro ou mot de passe incorrect.',400);
      if(e.status===429)throw nerr('Trop d’essais. Patientez quelques minutes.',429);
      throw e;
    });
  }
  function offlineLogin(phone,pw){
    var c=ST.creds[phone];
    if(ST.lk&&ST.lk[phone]){var le=nerr('Compte verrouillé par le propriétaire.',423);le.locked=true;throw le}
    if(c&&c.h===hashPw(pw,'dev')){ST.auth={uid:c.uid,phone:phone,at:null,rt:c.rt,exp:0,epoch:c.epoch,profile:c.profile,offline:true};writeSt();return {user:toUser(c.profile),online:false}}
    throw nerr('Pas de connexion Internet. Une première connexion avec Internet est nécessaire sur cet appareil.',0);
  }
  function requestUnlock(phone,pw){
    return http('POST','/auth/v1/token?grant_type=password',{email:phone+'@interkin.app',password:pw},null,true).then(function(j){
      return http('POST','/rest/v1/rpc/request_unlock',{},{Authorization:'Bearer '+j.access_token},true)},function(e){
      if(e.status===400||e.status===401||e.status===422)throw nerr('Numéro ou mot de passe incorrect.',400);throw e});
  }
  function forceOut(m){
    var had=U.user;U.user=null;S.session=null;ST.auth=null;writeSt();resetSale();rawSave();render();
    if(had)openModal('<h3>Session fermée</h3><p class="muted">'+esc(m)+'</p><button class="btn primary wide" data-a="closeModal">OK</button>');
  }
  function logout(){
    var a=ST.auth;if(!a)return Promise.resolve();api.catDone=false;
    return cycle(true).then(function(){},function(){}).then(function(){if(!U.user&&ST.auth===a){ST.auth=null;writeSt()}});
  }

  /* ----- profils ----- */
  function checkProfile(){
    var a=ST.auth;
    if(a.profile.role==='seller')return call('GET','/rest/v1/profiles?id=eq.'+a.uid+'&select=*').then(function(rows){
      var p=rows&&rows[0];
      if(!p||!p.active){forceOut('Votre compte a été désactivé.');throw HALT}
      if(p.locked){ST.lk=ST.lk||{};ST.lk[a.phone]=1;forceOut('Votre compte a été verrouillé par le propriétaire. Pour vous reconnecter, demandez-lui son autorisation.');throw HALT}
      if(p.epoch!==a.epoch){if(ST.creds)delete ST.creds[a.phone];forceOut('Session fermée : votre compte a été ouvert sur un autre appareil ou fermé par le propriétaire.');throw HALT}
      a.profile=p;S.users=[toUser(p)];rawSave();
    });
    return profiles();
  }
  function profiles(){
    return call('GET','/rest/v1/profiles?select=*&order=created_at.asc').then(function(rows){
      var sg=JSON.stringify(S.users);S.users=rows.filter(function(p){return p.active}).map(toUser);if(JSON.stringify(S.users)!==sg)needRender=true;rawSave();return S.users});
  }

  /* ----- envoi ----- */
  function sendRows(mode,rows){
    var body=rows.map(function(r){return {coll:r.coll,id:r.id,pdv_id:r.pdv,data:r.data,deleted:!!r.del}});
    return call('POST','/rest/v1/records?on_conflict=coll,id',body,{Prefer:'resolution='+(mode==='i'?'ignore':'merge')+'-duplicates,return=minimal'});
  }
  function done(r){if(r.del)delete ST.base[r.coll+'/'+r.id];else ST.base[r.coll+'/'+r.id]=r.h}
  function sendGroup(mode,rows){
    return sendRows(mode,rows).then(function(){rows.forEach(done)},function(e){
      if(!e.status||e.status>=500||e.status===401)throw e;
      var p=Promise.resolve();
      rows.forEach(function(r){p=p.then(function(){return sendRows(mode,[r]).then(function(){done(r)},function(e2){
        if(!e2.status||e2.status>=500||e2.status===401)throw e2;
        ST.rej.unshift({k:r.coll+'/'+r.id,msg:msg(e2),ts:Date.now()});ST.rej.length=Math.min(ST.rej.length,30);
        if(r.del)delete ST.base[r.coll+'/'+r.id];else ST.base[r.coll+'/'+r.id]=r.h})})});
      return p;
    });
  }
  function push(){
    var role=ST.auth.profile.role==='owner'?'o':'s',R=recs(),rows=[];
    Object.keys(R).forEach(function(k){var r=R[k],m=SPEC[r.coll][role];if(!m)return;
      if((r.coll==='stock'||r.coll==='istock')&&!api.stockDirty)return;
      if(ST.base[k]!==r.h){if(!r.data&&r.mk)r.data=r.mk();r.mode=m;rows.push(r)}});
    if(role==='o')Object.keys(ST.base).forEach(function(k){if(R[k])return;var c=k.slice(0,k.indexOf('/'));
      if(!TOMB[c])return;if((c==='stock'||c==='istock')&&!api.stockDirty)return;
      rows.push({coll:c,id:k.slice(c.length+1),pdv:null,data:{},del:true,mode:'u'})});
    rows.sort(function(a,b){return (PRIO[a.coll]!=null?PRIO[a.coll]:2)-(PRIO[b.coll]!=null?PRIO[b.coll]:2)});
    var groups=[];
    rows.forEach(function(r){var pr=PRIO[r.coll]!=null?PRIO[r.coll]:2,g=groups[groups.length-1];
      if(g&&g.mode===r.mode&&g.pr===pr&&g.rows.length<100&&r.coll!=='config'&&r.coll!=='pay'&&g.rows[0].coll!=='config'&&g.rows[0].coll!=='pay')g.rows.push(r);else groups.push({mode:r.mode,pr:pr,rows:[r]})});
    var p=Promise.resolve();
    groups.forEach(function(g){p=p.then(function(){return sendGroup(g.mode,g.rows)})});
    return p.then(function(){api.stockDirty=false;writeSt()});
  }

  /* ----- réception ----- */
  function pull(){
    var a=ST.auth,uid=a.uid,cur=ST.cur[uid]||null,rows=[],fo='';
    function more(filter){return call('GET','/rest/v1/records?select=coll,id,pdv_id,data,deleted,updated_at&order=updated_at.asc&limit=1000'+filter).then(function(r){
      rows=rows.concat(r);if(r.length>=1000)return more('&updated_at=gt.'+encodeURIComponent(r[r.length-1].updated_at)+fo)})}
    var f=cur?'&updated_at=gte.'+encodeURIComponent(new Date(Date.parse(cur)-10000).toISOString()):'';
    if(!S.arch){var kc=keepCfg(a.profile.role==='owner'?'o':'s');S.arch=Date.now()-kc.days*864e5}
    /* première réception : on ne télécharge pas les anciennes ventes ni les anciens journaux */
    if(!cur&&S.arch)fo='&or='+encodeURIComponent('(coll.in.(products,ingredients,pdvs,config,stock,istock,customers,ledger,shifts,withdrawals,floats,resets,pay),updated_at.gte.'+new Date(S.arch).toISOString()+')');
    return more(f+fo).catch(function(e){if(fo&&e&&e.status===400){fo='';rows=[];return more(f)}throw e}).then(function(){
      var ch=applyAll(rows,a.profile.role==='owner');
      if(rows.length)ST.cur[uid]=rows[rows.length-1].updated_at;
      if(a.profile.role==='owner'&&!rows.length&&!cur&&!S.pdvs.length&&!S.products.length){seedCatalog();ch=true}
      writeSt();return ch});
  }
  function pullCatalog(){
    var rows=[];
    return call('GET','/rest/v1/records?select=coll,id,pdv_id,data,deleted,updated_at&coll=in.(products,ingredients,pdvs,config,stock,istock)&limit=5000').then(function(r){
      return applyAll(r,false)})}
  function seedCatalog(){api.stockDirty=true;var d=seed();S.pdvs=d.pdvs;S.ingredients=d.ingredients;S.products=d.products;brand();
    S.users=S.users||[];setTimeout(function(){toast('Catalogue de départ créé : modifiez-le dans Produits et Gestion.')},300)}
  function applyAll(rows,owner){
    if(!rows.length)return false;
    var cur=recs(),touched={},synced={},changed=false,unsent=pendCount()>0;
    var pass=rows.filter(function(r){return r.coll!=='stock'&&r.coll!=='istock'}).concat(rows.filter(function(r){return r.coll==='stock'||r.coll==='istock'}));
    pass.forEach(function(r){
      var k=r.coll+'/'+r.id,c=cur[k],isSt=r.coll==='stock'||r.coll==='istock';
      if(r.coll==='sales'&&!c&&S.arch&&r.data&&r.data.ts<S.arch)return;   /* vente plus ancienne que l'historique gardé ici */
      if(isSt){if((owner&&api.stockDirty)||unsent)return}
      else if(SPEC[r.coll][owner?'o':'s']){
        if(c&&ST.base[k]!==c.h)return;                       /* modification locale pas encore envoyée */
        if(!c&&ST.base[k]!==undefined&&!r.deleted)return;     /* suppression locale pas encore envoyée */
      }
      if(c&&!r.deleted&&(ARR0[r.coll]||c.h===cyrb53(stab(r.data)))){synced[k]=1;return}
      if(!c&&r.deleted)return;
      applyRec(r);touched[k]=1;changed=true;
    });
    var after=recs();
    rows.forEach(function(r){var k=r.coll+'/'+r.id;
      if(after[k]){if(touched[k]||synced[k])ST.base[k]=after[k].h}
      else if(r.deleted)delete ST.base[k]});
    if(changed){sortAll();rawSave()}
    if(changed&&owner&&rows.some(function(r){return r.coll==='customers'})&&mergeDuplicates())rawSave();
    return changed;
  }

  /* ----- cycle ----- */
  function idle(){var ae=document.activeElement;return !(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))&&$('#modal').hidden&&!P&&!V}
  function run(){
    var fresh=!ST.cur[ST.auth.uid],chg=false,seller=ST.auth.profile.role==='seller';
    return ensureTok().then(checkProfile).then(function(){return fresh?pull():push()}).then(function(c){chg=c;return fresh?push():pull()}).then(function(c){chg=chg||c===true;return flushPins()})
      .then(function(c){chg=chg||c===true;if(seller&&!api.catDone){api.catDone=true;return pullCatalog().then(function(x){chg=chg||x})}})
      .then(function(){ST.last=Date.now();writeSt();setNet(true);try{archiveOld()}catch(e){console.warn('archive',e)}return chg});
  }
  function cycle(force){
    if(busy){again=true;return busy}
    if(!ST.auth||(!U.user&&!force))return Promise.resolve();
    busy=run().then(function(ch){
      busy=null;if(again){again=false;kick(200)}if(ch&&typeof refreshLive==='function')refreshLive();if(ch||needRender){if(U.user&&idle()){needRender=false;if(window.dbg)dbg('affichage rafraichi (synchro)');render()}else needRender=true}
    },function(e){
      busy=null;if(again){again=false;kick(2000)}
      if(e===HALT)return;
      if(!e.status){setNet(false);return}
      if(e.expired&&U.user){forceOut('Votre connexion a expiré. Reconnectez-vous avec Internet.');return}
      if(e.status>=500){setNet(false);return}
      console.warn('sync',e);
    });
    return busy;
  }
  function kick(ms){if(!SYNC_ON||!ST.auth)return;clearTimeout(timer);timer=setTimeout(function(){timer=null;cycle()},ms==null?600:ms)}
  function start(){
    if(!SYNC_ON||api.started)return;api.started=true;
    setInterval(function(){if(document.visibilityState==='hidden')return;var o=ST.auth&&ST.auth.profile&&ST.auth.profile.role==='owner';if(!o&&(tick++%2))return;cycle()},6000);
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')kick(200)});
    window.addEventListener('focus',function(){kick(200)});window.addEventListener('pageshow',function(){kick(200)});
    kick(300);
  }
  function init(){
    if(!SYNC_ON)return;
    if(!S.sid||S.sid!==ST.sid){var keep={creds:ST.creds,auth:null};ST={v:1,sid:rid(),base:{},cur:{},creds:keep.creds||{},auth:null,rej:[],last:0};S=blank();S.sid=ST.sid;writeSt();rawSave()}
  }
  function settle(keys){var R=recs();keys.forEach(function(k){if(ST.base[k]!==undefined&&R[k])ST.base[k]=R[k].h});writeSt()}
  function flushPins(){
    var q=ST.pinq||{},ids=Object.keys(q);
    if(!ids.length||ST.auth.offline)return Promise.resolve();
    var p=Promise.resolve();
    ids.forEach(function(id){p=p.then(function(){return call('POST','/rest/v1/rpc/set_customer_pin',{p_cust:id,p_pin:q[id]}).then(function(){delete ST.pinq[id];writeSt()},function(e){
      if(!e.status||e.status>=500||e.status===401)throw e;
      if(/introuvable/i.test(e.message||''))return;          /* le client n'est pas encore arrivé sur le serveur : on réessaie au prochain échange */
      delete ST.pinq[id];writeSt()})})});
    return p;
  }
  function setPin(id,pin){ST.pinq=ST.pinq||{};ST.pinq[id]=pin;writeSt();kick(300)}
  function rpc(name,args){
    if(!ST.auth||ST.auth.offline||!U.online)return Promise.reject(nerr('Connexion internet requise.',0));
    return call('POST','/rest/v1/rpc/'+name,args||{});
  }
  function first(r){
    if(!r.online)return Promise.resolve();
    return run().catch(function(e){if(e===HALT)throw e;if(e.status&&e.status<500)throw e;});
  }
  function statusHTML(){
    var n=pendCount(),rj=ST.rej||[];
    return '<div class="item"><div class="grow muted">Dernier échange avec le serveur</div><b>'+(ST.last?ago(ST.last):'jamais')+'</b></div>'
      +'<div class="item"><div class="grow muted">Ventes en attente d’envoi</div><b class="num">'+n+'</b></div>'
      +(rj.length?'<div class="note bad" style="margin-top:8px"><b>'+rj.length+' élément(s) refusé(s) par le serveur</b><div class="small">'+esc(rj[0].k+' : '+rj[0].msg)+'</div></div>':'');
  }
  var api={ST:function(){return ST},verifyOnline:function(code){
      var a=ST.auth;if(!a||a.offline||!U.online||!a.phone)return Promise.resolve(false);
      return http('POST','/auth/v1/token?grant_type=password',{email:a.phone+'@interkin.app',password:code},null,true).then(function(j){
        if(!j||!j.access_token)return false;var c=ST.creds[a.phone];if(c){c.h=hashPw(code,'dev');c.num=/^\d{4,12}$/.test(code);writeSt()}return true},function(){return false})},chk:function(code){var c=ST.auth&&ST.creds[ST.auth.phone];return !!c&&c.h===hashPw(code,'dev')},codeNum:function(){var c=ST.auth&&ST.creds[ST.auth.phone];return !c||c.num!==false},persist:function(){writeSt()},setPin:setPin,requestUnlock:requestUnlock,login:login,logout:logout,first:first,kick:kick,start:start,init:init,settle:settle,rpc:rpc,profiles:profiles,msg:msg,
    pend:pendCount,statusHTML:statusHTML,cycle:function(){return cycle()},stockDirty:false,started:false,
    renamePhone:function(o,n){if(ST.creds[o]){ST.creds[n]=ST.creds[o];delete ST.creds[o]}if(ST.auth&&ST.auth.phone===o)ST.auth.phone=n;writeSt()},
    dirtyStock:function(){api.stockDirty=true;kick(400)},
    role:function(){return ST.auth&&ST.auth.profile?ST.auth.profile.role:null},
    hasAuth:function(uid){return !!(ST.auth&&ST.auth.uid===uid)}};
  return api;
})();

KV.onFail(function(){toast('Mémoire de l’appareil pleine ou bloquée : certaines données risquent de ne pas être gardées hors ligne. Synchronisez et libérez de la place.','bad')});
if(KV.failed())toast('Mémoire de l’appareil pleine ou bloquée.','bad');
Sync.init();
if(!SYNC_ON)mergeDuplicates();
(function(){var se=S.session,u=se&&userById(se.uid);if(u&&(!SYNC_ON||Sync.hasAuth(se.uid))){U.lpdv=se.pdvId;startSession(u,true)}else S.session=null})();
render();
Sync.start();
});
</script>
