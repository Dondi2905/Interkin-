<meta name="mobile-web-app-capable" content="yes">

<style>
/* Layout: terminal-style single column (max 560px), top identity bar, fixed bottom dock with sale action + tabs.
   Palette: cool slate neutrals, signal blue for actions, amber reserved for loyalty points, paper tokens for the 58 mm ticket. */
:root{
  --bg:#F5F8FB; --surface:#FFFFFF; --surface-2:#F3F5F8; --ink:#0F1A24; --muted:#586878; --line:#D4DBE3;
  --accent:#1F46E0; --accent-ink:#FFFFFF; --accent-soft:#E2E8FC;
  --pts:#9A5200; --pts-soft:#FCEAD2;
  --good:#0D7A4A; --good-soft:#D8F1E4; --bad:#B3261E; --bad-soft:#FBE2DF;
  --paper:#FBFAF6; --paper-ink:#1B1B1B; --paper-line:#C9C6BC;
  --shadow:0 1px 2px rgba(15,26,36,.07),0 6px 18px rgba(15,26,36,.06);
  --font-head:'Space Grotesk',system-ui,sans-serif;
  --font-body:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --font-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  --dockH:190px;
  color-scheme:light;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);
  padding-block:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-tap-highlight-color:transparent}
button{font:inherit;color:inherit;cursor:pointer}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
h1,h2,h3{font-family:var(--font-head);margin:0;text-wrap:balance}
.shell{max-width:560px;margin:0 auto}
.main{padding-bottom:var(--dockH)}
[hidden]{display:none!important}

/* top bar */
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 0 6px}
.brand{font:700 21px/1 var(--font-head);letter-spacing:-.015em;display:flex;align-items:center;gap:8px}
.demo{font:600 10px/1 var(--font-body);letter-spacing:.08em;text-transform:uppercase;color:var(--pts);background:var(--pts-soft);padding:4px 6px;border-radius:4px}
.who{font-size:13px;color:var(--muted);margin-top:5px;display:flex;flex-wrap:wrap;gap:4px 10px;align-items:center}
.live{display:inline-flex;align-items:center;gap:5px}
.live i{width:7px;height:7px;border-radius:50%;background:var(--good);display:inline-block}
.live.off i{background:var(--muted)}

/* headings, cards */
.h{font:600 12px/1 var(--font-body);letter-spacing:.09em;text-transform:uppercase;color:var(--muted);margin:22px 2px 10px}
.sub-h{font:600 13px/1.2 var(--font-body);margin:0 0 6px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px;box-shadow:var(--shadow)}
.card + .card{margin-top:12px}
.stack{display:flex;flex-direction:column;gap:10px}
.row{display:flex;align-items:center;gap:10px}
.row.sp{justify-content:space-between}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.pts{color:var(--pts);font-weight:600}
.good{color:var(--good)} .bad{color:var(--bad)}
.hint{font-size:13px;color:var(--muted)}

/* buttons, inputs */
.btn{min-height:44px;padding:10px 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-weight:500;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.07)}
.btn.primary:disabled{background:var(--surface-2);border-color:var(--line);color:var(--muted);cursor:not-allowed;filter:none}
.btn:disabled{color:var(--muted);cursor:not-allowed}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.on{background:var(--pts-soft);border-color:var(--pts);color:var(--pts)}
.btn.wide{width:100%}
.btn.sm{min-height:36px;padding:6px 10px;font-size:14px}
.btn.big{min-height:52px;padding:12px 20px;font-size:16px}
.inp,.sel{width:100%;min-height:46px;padding:10px 12px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink)}
.inp::placeholder{color:var(--muted)}
.lbl{display:block;font-size:13px;font-weight:500;color:var(--muted);margin:12px 0 6px}
.lbl:first-child{margin-top:0}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:1fr;gap:4px;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:4px}
.seg button{border:0;background:transparent;border-radius:7px;min-height:42px;font-weight:500;padding:6px 4px}
.seg button[aria-pressed="true"]{background:var(--surface);box-shadow:var(--shadow);color:var(--accent);font-weight:600}
.quick{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.rrow{display:grid;grid-template-columns:minmax(0,1fr) 88px 44px;gap:8px;margin-top:8px;align-items:center}
.rrow .btn{padding:0;min-height:46px}
.rblock{margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
.newing{margin-top:8px;padding:10px;border:1px dashed var(--line);border-radius:8px;display:flex;flex-direction:column;gap:8px}

/* products */
.pgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.prod{position:relative;text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;min-height:104px;display:flex;flex-direction:column;gap:6px;box-shadow:var(--shadow)}
.prod:active{transform:scale(.985)}
.prod .pn{font-weight:600;line-height:1.25;overflow-wrap:anywhere;padding-right:24px}
.prod .pp{font-family:var(--font-head);font-weight:500;font-variant-numeric:tabular-nums}
.stk{font:500 12px/1 var(--font-body);color:var(--muted)}
.stk.low{color:var(--bad);font-weight:600}
.badge{position:absolute;top:8px;right:8px;min-width:24px;height:24px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font:600 13px/24px var(--font-body);text-align:center;padding:0 7px}
.chip{display:inline-flex;align-items:center;font-size:12px;font-weight:600;padding:3px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);width:fit-content;font-variant-numeric:tabular-nums}
.chip.pts{background:var(--pts-soft);color:var(--pts)}
.chip.good{background:var(--good-soft);color:var(--good)}
.chip.bad{background:var(--bad-soft);color:var(--bad)}

/* lists */
.item{display:flex;align-items:center;gap:10px;padding:10px 0;border-top:1px solid var(--line)}
.item:first-child{border-top:0;padding-top:0}
.item:last-child{padding-bottom:0}
.rowbtn{width:100%;text-align:left;background:transparent;border:0;border-top:1px solid var(--line);padding:12px 0;display:flex;align-items:center;gap:10px}
.rowbtn:first-child{border-top:0;padding-top:2px}
.rowbtn:hover{background:var(--surface-2)}
.qty{display:inline-flex;align-items:center;gap:2px}
.qty button{width:36px;height:36px;border-radius:8px;border:1px solid var(--line);background:var(--surface);font-size:18px;line-height:1}
.qty b{min-width:28px;text-align:center;font-variant-numeric:tabular-nums}
.calc{margin-top:14px;border-top:1px dashed var(--line);padding-top:12px;display:flex;flex-direction:column;gap:6px}
.calc .l{display:flex;justify-content:space-between;gap:10px;font-variant-numeric:tabular-nums}
.calc .l.t{font-weight:600;font-size:16px}
.note{border-radius:8px;padding:10px 12px;font-size:13px;background:var(--surface-2);color:var(--muted)}
.note + .note{margin-top:8px}
.note.pts{background:var(--pts-soft);color:var(--pts)}
.note.bad{background:var(--bad-soft);color:var(--bad)}
.note.good{background:var(--good-soft);color:var(--good)}

/* kpis */
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.kpis.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:12px;box-shadow:var(--shadow)}
.button-kpi,button.kpi{text-align:left;width:100%;font:inherit;color:inherit;cursor:pointer}
.kpi .k{font-size:12px;color:var(--muted)}
.kpi .v{font:600 20px/1.2 var(--font-head);margin-top:4px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.kpis.three .v{font-size:16px}
.kpi .s{font-size:12px;color:var(--muted);margin-top:2px}

/* dock */
.dock{position:fixed;left:0;right:0;bottom:0;background:var(--surface);border-top:1px solid var(--line);z-index:20;
  padding:0 max(16px,env(safe-area-inset-left,0px)) env(safe-area-inset-bottom,0px) max(16px,env(safe-area-inset-right,0px))}
.dock-in{max-width:560px;margin:0 auto}
.act{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-bottom:1px solid var(--line)}
.act .tl{font-size:12px;color:var(--muted)}
.act .amt{font:700 24px/1.1 var(--font-head);font-variant-numeric:tabular-nums}
.act .why{font-size:12px;color:var(--muted);margin-top:2px}
.nav{display:grid;grid-auto-flow:column;grid-auto-columns:1fr}
.nav button{background:transparent;border:0;min-height:56px;padding:6px 1px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:500;color:var(--muted)}
.nav button[aria-current="page"]{color:var(--accent);font-weight:600}
.nav svg{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* modal + pin */
#modal{position:fixed;top:0;left:0;right:0;bottom:0;z-index:40}
.scrim{position:absolute;top:0;left:0;right:0;bottom:0;background:rgba(8,14,20,.55)}
.sheet{position:absolute;left:0;right:0;bottom:0;margin:0 auto;max-width:560px;max-height:92%;overflow:auto;background:var(--surface);border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-left,0px)) calc(18px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));box-shadow:var(--shadow)}
.sheet h3{font-size:20px;margin-bottom:12px}
#pin{position:fixed;top:0;left:0;right:0;bottom:0;z-index:60;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:16px}
.pin-card{width:100%;max-width:360px;text-align:center}
.pin-tag{display:inline-block;font:600 11px/1 var(--font-body);letter-spacing:.1em;text-transform:uppercase;color:var(--accent);background:var(--accent-soft);padding:6px 10px;border-radius:5px}
.pin-card h3{font-size:22px;margin:14px 0 4px}
.dots{display:flex;justify-content:center;gap:14px;margin:22px 0 8px}
.dots i{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);display:block}
.dots i.f{background:var(--ink);border-color:var(--ink)}
.pin-msg{min-height:20px;font-size:13px;color:var(--bad)}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:14px}
.keys button{min-height:64px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font:500 24px/1 var(--font-head)}
.keys button.fn{font:500 14px/1 var(--font-body);color:var(--muted)}
.keys button:active{background:var(--accent-soft)}

/* ticket: 32 columns, like a 58 mm thermal roll */
.paper{background:var(--paper);color:var(--paper-ink);border:1px solid var(--paper-line);border-radius:3px;padding:16px 14px;margin:0 auto;width:fit-content;max-width:100%;overflow-x:auto;box-shadow:var(--shadow)}
.paper pre{margin:0;font:400 13.5px/1.35 var(--font-mono);white-space:pre}
#printArea{display:none}
@media print{
  @page{margin:0}
  html,body{background:#fff!important;margin:0!important;padding:0!important;height:auto!important;min-height:0!important;overflow:visible!important;display:block!important}
  body>*:not(#printArea){display:none!important}
  #printArea{display:block!important;position:static!important;margin:0!important;padding:0!important;width:58mm;background:#fff}
  #printArea .paper{border:0!important;box-shadow:none!important;border-radius:0!important;background:#fff!important;color:#000!important;width:58mm!important;max-width:58mm!important;padding:1mm 5mm 6mm!important;margin:0!important;overflow:visible!important;box-sizing:border-box;position:static!important}
  #printArea .paper img{height:auto!important;margin:0 auto 2mm!important;display:block}
  #printArea .paper pre{font:400 7.1pt/1.22 'DejaVu Sans Mono',monospace!important;color:#000!important;margin:0}
}

/* login */
.login{max-width:440px;margin:0 auto;padding:32px 0}
.login h1{font-size:34px;letter-spacing:-.02em;margin:10px 0 6px}

/* toast */
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--dockH) + 8px);z-index:80;max-width:min(92vw,520px);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:8px;font-size:14px;box-shadow:var(--shadow);opacity:0;pointer-events:none;transition:opacity .2s}
#toast.show{opacity:1}
@media (prefers-reduced-motion:reduce){#toast{transition:none}.prod:active{transform:none}}
svg.map,svg.chart{width:100%;height:auto;display:block}
svg.map{background:var(--surface-2);border-radius:8px;border:1px solid var(--line)}
</style>
</head>

<script>
/* affiche toute erreur de l'application en bandeau rouge (aide au dépannage) */
(function(){
  function show(m){try{
    var d=document.getElementById('errbar');
    if(!d){d=document.createElement('div');d.id='errbar';d.setAttribute('role','alert');
      d.style.cssText='position:fixed;left:0;right:0;top:0;z-index:99999;background:#B3261E;color:#fff;font:12px/1.35 monospace;padding:8px 10px;white-space:pre-wrap;word-break:break-all';
      d.onclick=function(){d.remove()};document.body.appendChild(d)}
    var ua=(navigator.userAgent.match(/Chrome\/[\d.]+/)||['?'])[0];
    d.textContent='Erreur (touchez pour fermer) : '+m+'\n'+ua}catch(e){}}
  var DBG=false;try{if(/[?&]debug=1/.test(location.search))localStorage.setItem('interkin-debug','1');if(/[?&]debug=0/.test(location.search))localStorage.removeItem('interkin-debug');DBG=localStorage.getItem('interkin-debug')==='1'}catch(e){}
  var lines=[];window.dbg=function(m){if(!DBG)return;try{
    lines.push(new Date().toLocaleTimeString('fr-FR')+' '+m);if(lines.length>9)lines.shift();
    var d=document.getElementById('dbgbar');
    if(!d){d=document.createElement('div');d.id='dbgbar';d.style.cssText='position:fixed;left:0;bottom:0;z-index:99998;background:rgba(0,0,0,.82);color:#7CFC9A;font:11px/1.3 monospace;padding:4px 6px;pointer-events:none;max-width:100%';document.body.appendChild(d)}
    d.textContent='DIAG '+lines.join('\n');d.style.whiteSpace='pre'}catch(e){}};
  window.dbg('ecran '+innerWidth+'x'+innerHeight+' '+((navigator.userAgent.match(/Chrome\/[\d.]+/)||['?'])[0])+' inset:'+(window.CSS&&CSS.supports?CSS.supports('inset','0'):'?'));
  document.addEventListener('touchstart',function(e){var t=e.touches&&e.touches[0];window.dbg('touch '+(t?Math.round(t.clientX)+','+Math.round(t.clientY):'?'))},true);
  window.addEventListener('error',function(e){show((e.message||'erreur')+(e.lineno?' [ligne '+e.lineno+']':''))});
  window.addEventListener('unhandledrejection',function(e){var r=e.reason;show('promesse : '+((r&&r.message)||r))});
})();
</script>

/* ---------- logo (noir et blanc, largeur max 384 points = 58 mm) ---------- */
function processLogo(file,cb){
  var fr=new FileReader();
  fr.onerror=function(){cb(null)};
  fr.onload=function(){var im=new Image();
    im.onerror=function(){cb(null)};
    im.onload=function(){
      var w=Math.min(384,im.width),h=Math.round(im.height*w/im.width);
      if(h>240){w=Math.max(1,Math.round(w*240/h));h=240}
      var c=document.createElement('canvas');c.width=w;c.height=h;var x=c.getContext('2d');
      x.fillStyle='#fff';x.fillRect(0,0,w,h);x.drawImage(im,0,0,w,h);
      var d=x.getImageData(0,0,w,h),a=d.data,g=new Float32Array(w*h),i,xx,yy;
      for(i=0;i<w*h;i++)g[i]=0.299*a[i*4]+0.587*a[i*4+1]+0.114*a[i*4+2];
      for(yy=0;yy<h;yy++)for(xx=0;xx<w;xx++){i=yy*w+xx;var o=g[i],nv=o<128?0:255,er=o-nv;g[i]=nv;
        if(xx+1<w)g[i+1]+=er*7/16;if(yy+1<h){if(xx>0)g[i+w-1]+=er*3/16;g[i+w]+=er*5/16;if(xx+1<w)g[i+w+1]+=er/16}}
      for(i=0;i<w*h;i++){var v=g[i]<128?0:255;a[i*4]=a[i*4+1]=a[i*4+2]=v;a[i*4+3]=255}
      x.putImageData(d,0,0);cb(c.toDataURL('image/png'),w,h)};
    im.src=fr.result};
  fr.readAsDataURL(file);
}

function openPin(cfg){P=Object.assign({digits:'',step:1,first:'',msg:'',tries:0},cfg);renderPin()}
function renderPin(){
  var el=$('#pin');
  if(!P){el.hidden=true;el.innerHTML='';return}
  var title=P.title,sub=P.sub;
  if(P.mode==='create'){title=P.step===1?(P.t1||'Choisissez un code secret'):(P.t2||'Confirmez le code secret');}
  var d='';for(var i=0;i<4;i++)d+='<i class="'+(i<P.digits.length?'f':'')+'"></i>';
  var k='';['1','2','3','4','5','6','7','8','9'].forEach(function(n){k+='<button data-a="pk" data-v="'+n+'" aria-label="'+n+'">'+n+'</button>'});
  k+='<button class="fn" data-a="pk" data-v="cancel">Annuler</button><button data-a="pk" data-v="0" aria-label="0">0</button><button class="fn" data-a="pk" data-v="del" aria-label="Effacer">⌫</button>';
  el.innerHTML='<div class="pin-card"><span class="pin-tag">Écran client</span><h3>'+esc(title)+'</h3><div class="muted small">'+esc(sub||'')+'</div>'
    +'<div class="dots" aria-label="'+P.digits.length+' chiffres saisis">'+d+'</div><div class="pin-msg" role="alert">'+esc(P.msg)+'</div><div class="keys">'+k+'</div>'
    +'<p class="hint" style="margin-top:16px">'+(P.mode==='verify'?'Passez le terminal au client. Démo : le code des clients de départ est 1234.':'4 chiffres. Le vendeur ne voit pas le code.')+'</p></div>';
  el.hidden=false;
}
function pinKey(v){
  if(!P)return;
  if(v==='cancel'){var cb=P.onCancel;P=null;renderPin();if(cb)cb();return}
  if(v==='del'){P.digits=P.digits.slice(0,-1);P.msg='';renderPin();return}
  if(P.digits.length>=4)return;
  P.digits+=v;renderPin();
  if(P.digits.length===4)setTimeout(pinSubmit,140);
}
function pinSubmit(){
  if(!P)return;var pin=P.digits;
  if(P.mode==='verify'){
    if(P.verify(pin)){var ok=P.onOk;P=null;renderPin();ok(pin)}
    else{P.tries++;P.digits='';
      if(P.tries>=3){var cb=P.onCancel;P=null;renderPin();toast('Trop d’essais. Utilisation des points annulée.');if(cb)cb();return}
      P.msg='Code incorrect. '+(3-P.tries)+' essai(s) restant(s).';renderPin()}
  }else{
    if(P.step===1){P.first=pin;P.step=2;P.digits='';P.msg='';renderPin()}
    else if(pin===P.first){var ok2=P.onOk;P=null;renderPin();ok2(pin)}
    else{P.step=1;P.first='';P.digits='';P.msg='Les deux codes sont différents. Recommencez.';renderPin()}
  }
}

  var vals=days.map(function(x){return x.v}),mx=Math.max.apply(null,[1].concat(vals)),mn=Math.min.apply(null,[0].concat(vals));

function mergeDuplicates(){
  if(SYNC_ON&&Sync.role()!=='owner')return 0;
  var g={},n=0;S.merges=S.merges||[];
  S.customers.forEach(function(c){var k=digits(c.phone).slice(-9);if(k.length>=9)(g[k]=g[k]||[]).push(c)});
  Object.keys(g).forEach(function(k){var l=g[k];if(l.length<2)return;
    l.sort(function(a,b){return (a.createdAt||0)-(b.createdAt||0)});var keep=l[0];
    l.slice(1).forEach(function(d){
      var moved=0;S.ledger.forEach(function(x){if(x.acc===d.id){x.acc=keep.id;moved+=x.pts}});
      S.sales.forEach(function(x){if(x.custId===d.id){x.custId=keep.id;x.custName=keep.name}});
      S.customers.forEach(function(x){if(x.sponsorId===d.id)x.sponsorId=(x.id===keep.id?null:keep.id)});
      S.resets.forEach(function(x){if(x.custId===d.id)x.custId=keep.id});
      if(!keep.sponsorId&&d.sponsorId&&d.sponsorId!==keep.id)keep.sponsorId=d.sponsorId;
      S.customers=S.customers.filter(function(x){return x!==d});
      S.merges.unshift({ts:Date.now(),kept:keep.name,dup:d.name,phone:keep.phone,pts:moved});n++});
  });
  if(n)save();
  return n;
}

  var c=calc(),cust=c.cust,h='';

  else if(cust&&c.bal>0){
    var on=U.usePoints&&U.unlocked;
    h+='<button class="btn wide'+(on?' on':'')+'" data-a="togglePts">'+(on?'Points utilisés ✓ (annuler)':'Payer avec des points ('+fmt(c.bal)+' pts)')+'</button>';
    if(on)h+='<label class="lbl" for="pts">Points à utiliser (1 point = 1 FC)</label><input id="pts" class="inp" inputmode="decimal" data-i="pts" value="'+esc(U.pts)+'"><div class="hint" style="margin-top:4px">Maximum '+fmt(Math.min(c.bal,c.total))+' pts. Complétez avec des espèces si besoin.</div>';
  }
  h+='<label class="lbl" for="cash">Espèces reçues (FC)</label><input id="cash" class="inp" inputmode="decimal" data-i="cash" value="'+esc(U.cash)+'" placeholder="0">';
  h+='<div class="quick"><button class="btn sm" data-a="quick" data-v="exact">Montant exact</button>'+[1000,5000,10000,20000].map(function(v){return '<button class="btn sm" data-a="quick" data-v="'+v+'">'+fmt(v)+'</button>'}).join('')+'</div>';
  return h+'<div class="calc" id="payCalc">'+calcHTML(c)+'</div>';
}
function calcHTML(c){
  var h='<div class="l"><span class="muted">Total</span><span>'+fmt(c.total)+' FC</span></div>';
  if(c.pu>0)h+='<div class="l"><span class="muted">Payé avec des points</span><span class="pts">− '+fmt(c.pu)+' FC</span></div>';
  h+='<div class="l t"><span>À payer en espèces</span><span>'+fmt(c.due)+' FC</span></div>';
  if(c.due>0||c.paid>0)h+='<div class="l"><span class="muted">Monnaie à rendre</span><span>'+fmt(c.change)+' FC</span></div>';
  if(c.cust&&c.change>0)h+='<button class="btn wide'+(U.keep?' on':'')+'" style="margin-top:6px" data-a="keep">'+(U.keep?'Monnaie gardée en points ✓ (annuler)':'Garder '+fmt(c.change)+' FC en points (accord du client)')+'</button>';
  if(c.cust&&U.cart.length){
    if(c.pu>0)h+='<div class="note">Achat avec des points : aucun point d’achat ni de parrainage.'+(c.keep>0?' Seule la monnaie gardée devient des points (<b>'+fmt(c.keep)+' pts</b>).':'')+'</div>';
    else{
      h+='<div class="note pts">Ce client gagnera <b>'+fmt(c.earned)+' pts</b>'+(c.keep>0?' (dont '+fmt(c.keep)+' de monnaie gardée)':'')+'.</div>';
      if(U.user.role==='owner'&&(c.p1||c.p2))h+='<div class="note">Parrain direct : '+fmt(c.p1)+' pts → '+(c.s1?esc(c.s1.name):'Entreprise (pas de parrain)')+'<br>Parrain 2 : '+fmt(c.p2)+' pts → '+(c.s2?esc(c.s2.name):'Entreprise (pas de parrain)')+'</div>';
    }
  }else if(U.client==='none'&&U.cart.length)h+='<div class="note">Client sans compte : aucun point généré.</div>';
  return h;
}

var RESET_TTL=30*60000;
function resetActive(r){if(!(r.status==='pending'||(r.status==='approved'&&Date.now()-r.approvedAt<RESET_TTL)))return false;return !S.resets.some(function(x){return x.id!==r.id&&x.custId===r.custId&&x.status==='done'&&(x.doneAt||x.approvedAt||0)>=r.ts})}
function resetOf(cid){return S.resets.filter(function(r){return r.custId===cid&&resetActive(r)})[0]}
function resetBanner(){
  if(!U.user||U.user.role==='owner')return '';
  return S.resets.filter(function(r){return r.status==='approved'&&resetActive(r)&&r.pdvId===U.user.pdvId}).map(function(r){var c=custById(r.custId);
    return '<div class="note pts" style="margin-top:12px"><b>Réinitialisation autorisée</b> pour '+esc(c?c.name:'?')+' (valable '+Math.max(1,Math.ceil((RESET_TTL-(Date.now()-r.approvedAt))/60000))+' min).<button class="btn sm primary" style="margin-top:8px" data-a="doReset" data-id="'+r.id+'">Le client choisit son nouveau code</button></div>'}).join('');
}
function clientListHTML(){
  var n=norm(U.cl),d=digits(U.cl);

}

   +'<div class="kpi"><div class="k">Points utilisés</div><div class="v">'+fmt(b.used)+'</div></div>'

   +'<div class="card" style="margin-top:12px"><div class="small">Parrain direct : <b>'+(s1?esc(s1.name):'aucun')+'</b></div><div class="small" style="margin-top:4px">Parrain 2 : <b>'+(s2?esc(s2.name):'aucun')+'</b></div>'
   +'<div class="small muted" style="margin-top:4px">Filleuls directs : '+direct+' · Filleuls de niveau 2 : '+indirect+'</div></div>';
  var led=S.ledger.filter(function(l){return l.acc===id}).slice(-8).reverse();
  h+='<h2 class="h">Derniers mouvements de points</h2><div class="card">'+(led.length?led.map(function(l){return '<div class="item"><div class="grow small">'+esc(l.note)+'<div class="muted">'+dstr(l.ts)+'</div></div><b class="num '+(l.pts>0?'good':'bad')+'">'+(l.pts>0?'+':'')+fmt(l.pts)+'</b></div>'}).join(''):'<div class="muted">Aucun mouvement.</div>')+'</div>';
  if(owner){

    sales.forEach(function(s){s.items.forEach(function(i){ag[i.name]=(ag[i.name]||0)+i.qty})});

    else{h+='<div class="small" style="margin-bottom:8px">Produits les plus achetés : '+top.map(function(t){return '<span class="chip">'+esc(t)+' ×'+ag[t]+'</span>'}).join(' ')+'</div>'
      +sales.slice(0,8).map(function(s){return '<div class="item"><div class="grow small"><b>'+dstr(s.ts)+'</b> · N° '+pad(s.no)+'<div class="muted">'+s.items.map(function(i){return esc(i.name)+' ×'+i.qty}).join(', ')+'</div></div><b class="num">'+fmt(s.total)+' FC</b></div>'}).join('')}
    h+='</div>';
  }
  h+='<div class="stack" style="margin-top:16px"><button class="btn primary wide" data-a="useClient" data-id="'+id+'">Utiliser pour une vente</button>';
  if(owner)h+='<button class="btn wide" data-a="resetOwner" data-id="'+id+'">Réinitialiser le code secret (identité vérifiée)</button>';
  else{var rq=resetOf(id);
    if(!rq)h+='<button class="btn wide" data-a="reqReset" data-id="'+id+'">Demander la réinitialisation du code</button>';

    else h+='<button class="btn wide primary" data-a="doReset" data-id="'+rq.id+'">Réinitialisation autorisée : le client choisit son code</button>'}
  return h+'<button class="btn wide" data-a="closeModal">Fermer</button></div>';
}

function dkey(ts){var d=new Date(ts),m=d.getMonth()+1,j=d.getDate();return d.getFullYear()+'-'+(m<10?'0':'')+m+'-'+(j<10?'0':'')+j}
function consumption(list){
  var m={};
  list.forEach(function(s){(s.items||[]).forEach(function(it){
    var use=it.use;
    if(!use){var pr=S.products.filter(function(p){return p.id===it.id||p.name===it.name})[0];use=((pr&&pr.recipe)||[]).map(function(r){return {ing:r.ing,q:r.g}})}
    use.forEach(function(u){m[u.ing]=r6((m[u.ing]||0)+u.q*it.qty)})})});
  return m;
}
function consoRange(day,per){
  var p=day.split('-'),d=new Date(+p[0],+p[1]-1,+p[2]);d.setHours(0,0,0,0);var a=new Date(d),b=new Date(d);
  if(per==='week'){a.setDate(a.getDate()-((a.getDay()+6)%7));b=new Date(a);b.setDate(b.getDate()+7)}
  else if(per==='month'){a.setDate(1);b=new Date(a);b.setMonth(b.getMonth()+1)}
  else b.setDate(b.getDate()+1);
  return {a:a.getTime(),b:b.getTime()};
}

  var day=U.rday||dkey(Date.now()),per=U.rcp||'day',rg=consoRange(day,per);

/* ---------- comptes et caisse ---------- */
function pwField(id,ac){return '<div class="row"><input id="'+id+'" type="password" class="inp grow" autocomplete="'+(ac||'off')+'"><button type="button" class="btn" data-a="showpw" data-t="'+id+'" aria-label="Afficher ou masquer le mot de passe">Afficher</button></div>'}
function whoName(u){return u.role==='owner'?'Propriétaire':u.name}
function logEv(type,txt){S.log.unshift({ts:Date.now(),uid:U.user?U.user.id:null,name:U.user?whoName(U.user):'Système',pdvId:U.user?U.user.pdvId:null,type:type,txt:txt});if(S.log.length>600)S.log.length=600}
function userById(id){return S.users.find(function(u){return u.id===id})||null}
function openShift(uid){return S.shifts.find(function(h){return h.uid===uid&&h.state==='open'})||null}
function shiftEnd(h){return h.closeTs||Date.now()}
function shiftSales(h){return live(S.sales).filter(function(x){return x.sellerId===h.uid&&x.ts>=h.openTs&&x.ts<=shiftEnd(h)})}
function shiftWd(h){return S.withdrawals.filter(function(w){return w.pdvId===h.pdvId&&w.ts>=h.openTs&&w.ts<=shiftEnd(h)})}
function expectedCash(h){var c=h.float;shiftSales(h).forEach(function(x){c+=x.cashNet});shiftWd(h).forEach(function(w){c-=w.amount});return r2(c)}
function suggestedFloat(pdv){
  var f=S.floats[pdv],last=S.shifts.filter(function(h){return h.pdvId===pdv&&h.state==='closed'}).sort(function(a,b){return b.closeTs-a.closeTs})[0];
  var since=last?last.closeTs:0;
  if(f&&f.ts>=since)return f.amount;
  var base=last?(last.counted!=null?last.counted:last.expected):0,w=0;
  S.withdrawals.forEach(function(x){if(x.pdvId===pdv&&x.ts>since)w+=x.amount});
  return Math.max(0,r2(base-w));
}
function openCashView(){
  var u=U.user,pd=pdvById(u.pdvId),sg=suggestedFloat(u.pdvId);
  return '<h2 style="font-size:22px;margin-top:18px">Ouverture de caisse</h2><div class="card">'
   +'<p class="muted" style="margin:0 0 12px">PDV '+esc(pd?pd.name:'')+' · '+esc(u.name)+'. Comptez l’argent laissé dans la caisse avant de commencer à vendre.</p>'
   +'<div class="kpi"><div class="k">Fond de caisse prévu</div><div class="v">'+fmt(sg)+' FC</div></div>'
   +'<button class="btn primary big wide" style="margin-top:14px" data-a="openCashOk">Je confirme : '+fmt(sg)+' FC</button>'
   +'<label class="lbl" for="ofl">Le montant compté est différent ?</label><div class="row"><input id="ofl" class="inp grow" inputmode="decimal" data-i="dn" placeholder="Montant (FC)"><button class="btn" data-a="openCashDiff">Valider ce montant</button></div>'

}
function startShift(amount){
  var u=U.user,sg=suggestedFloat(u.pdvId);

  var u=U.user,h=openShift(u.id);

function shiftRow(h){
  var d=h.diff,chip=h.forced?'<span class="chip">Clôturé par le propriétaire</span>':(d===0?'<span class="chip good">Caisse juste</span>':'<span class="chip bad">'+(d>0?'Excédent +':'Manque ')+fmt(Math.abs(d))+' FC</span>');
  return '<div class="item" style="align-items:flex-start"><div class="grow"><div style="font-weight:600">'+esc(h.name)+'</div><div class="small muted">'+dstr(h.openTs)+' · '+tstr(h.openTs)+' → '+tstr(h.closeTs)+'</div>'
   +'<div class="small num muted">Attendu '+fmt(h.expected)+' · Compté '+(h.counted==null?'—':fmt(h.counted))+(h.float!==h.suggested?' · fond déclaré '+fmt(h.float)+' (prévu '+fmt(h.suggested)+')':'')+'</div></div>'+chip+'</div>';
}
function finishShift(h,counted,forced){
  h.closeTs=Date.now();h.expected=expectedCash(h);h.counted=forced?null:counted;h.diff=forced?null:r2(counted-h.expected);h.forced=!!forced;h.state='closed';
  logEv('shift_close','Clôture de caisse de '+h.name+' : attendu '+fmt(h.expected)+' FC'+(forced?' (clôture forcée)':', compté '+fmt(counted)+' FC, écart '+fmt(h.diff)+' FC'));
}

  saveProd:function(d){
    var name=$('#pn').value.trim(),price=num('pp'),cost=num('pc'),b=num('pb'),p1=num('p1'),p2=num('p2');
    if(!name){toast('Saisissez le nom du produit.');return}
    if(!(price>0)){toast('Saisissez un prix de vente supérieur à 0.');return}
    if(isNaN(cost)){toast('Saisissez le prix d’achat (0 si aucun).');return}
    if([b,p1,p2].some(function(v){return isNaN(v)})){toast('Saisissez les trois nombres de points (0 si aucun).');return}
    var bad=M.recipe.some(function(r){return r.ing==='__new'&&!(r.nn||'').trim()});
    if(bad){toast('Donnez un nom à chaque nouvel intrant.');return}
    M.recipe.forEach(function(r){
      if(r.ing!=='__new')return;
      var nm=r.nn.trim(),ex=S.ingredients.find(function(g){return norm(g.name)===norm(nm)});
      if(ex){r.ing=ex.id;return}
      var ni={id:'i'+nid(),name:nm,unit:newUnit(r.nu,r.nl),stock:{}};
      S.ingredients.push(ni);r.ing=ni.id;
    });
    var N=parseInt(M.batch,10),usesLot=M.recipe.some(function(r){return r.mode==='l'&&parseDec(r.g)>0});
    if(usesLot&&!(N>0)){toast('Saisissez la taille du lot.');return}
    var recipe=[];
    M.recipe.forEach(function(r){var v=parseDec(r.g);if(!(v>0))return;
      if(r.mode==='l')recipe.push({ing:r.ing,mode:'l',raw:v,g:r6(v/N)});else recipe.push({ing:r.ing,mode:'u',raw:v,g:r6(v)})});
    if(d.id){var p=prodById(d.id);var oldP=p.price;Object.assign(p,{name:name,price:price,cost:cost,b:b,p1:p1,p2:p2,recipe:recipe});if(usesLot)p.batch=N;else delete p.batch}
    else{
      var stock={};S.pdvs.forEach(function(pd){var v=num('st_'+pd.id);if(!isNaN(v))stock[pd.id]=Math.round(v)});
      var np={id:'r'+nid(),name:name,price:price,cost:cost,b:b,p1:p1,p2:p2,stock:stock,recipe:recipe};if(usesLot)np.batch=N;S.products.push(np);
    }

  /* qui a le droit d'écrire quoi (o = propriétaire, s = vendeur ; u = création/modification, i = ajout seulement) */

    }).then(function(rows){
      var p=rows&&rows[0];if(!p||!p.active)throw nerr('Ce compte est désactivé.',403);
      ST.auth.profile=p;
      if(p.role==='seller')return call('POST','/rest/v1/rpc/claim_session',{}).then(function(e){ST.auth.epoch=e;return p});
      ST.auth.epoch=p.epoch;return p;
    }).then(function(p){
      ST.creds[phone]={h:hashPw(pw,'dev'),uid:ST.auth.uid,rt:ST.auth.rt,epoch:ST.auth.epoch,profile:p};writeSt();
      return {user:toUser(p),online:true};
    },function(e){
      if(!e.status)return offlineLogin(phone,pw);
      ST.auth=null;
      if(e.status===400||e.status===401||e.status===422)throw nerr('Numéro ou mot de passe incorrect.',400);
      if(e.status===429)throw nerr('Trop d’essais. Patientez quelques minutes.',429);
      throw e;
    });
  }
  function offlineLogin(phone,pw){
    var c=ST.creds[phone];
    if(c&&c.h===hashPw(pw,'dev')){ST.auth={uid:c.uid,phone:phone,at:null,rt:c.rt,exp:0,epoch:c.epoch,profile:c.profile,offline:true};writeSt();return {user:toUser(c.profile),online:false}}
    throw nerr('Pas de connexion Internet. Une première connexion avec Internet est nécessaire sur cet appareil.',0);
  }
  function forceOut(m){
    var had=U.user;U.user=null;S.session=null;ST.auth=null;writeSt();resetSale();rawSave();render();
    if(had)openModal('<h3>Session fermée</h3><p class="muted">'+esc(m)+'</p><button class="btn primary wide" data-a="closeModal">OK</button>');
  }
  function logout(){
    var a=ST.auth;if(!a)return Promise.resolve();api.catDone=false;
    return cycle(true).then(function(){},function(){}).then(function(){if(!U.user&&ST.auth===a){ST.auth=null;writeSt()}});
  }

  /* ----- profils ----- */
  function checkProfile(){
    var a=ST.auth;
    if(a.profile.role==='seller')return call('GET','/rest/v1/profiles?id=eq.'+a.uid+'&select=*').then(function(rows){
      var p=rows&&rows[0];
      if(!p||!p.active){forceOut('Votre compte a été désactivé.');throw HALT}
      if(p.epoch!==a.epoch){forceOut('Session fermée : votre compte a été ouvert sur un autre appareil ou fermé par le propriétaire.');throw HALT}
      a.profile=p;S.users=[toUser(p)];rawSave();
    });
    return profiles();
  }
  function profiles(){
    return call('GET','/rest/v1/profiles?select=*&order=created_at.asc').then(function(rows){
      S.users=rows.filter(function(p){return p.active}).map(toUser);rawSave();return S.users});
  }

  /* ----- envoi ----- */
  function sendRows(mode,rows){
    var body=rows.map(function(r){return {coll:r.coll,id:r.id,pdv_id:r.pdv,data:r.data,deleted:!!r.del}});
    return call('POST','/rest/v1/records?on_conflict=coll,id',body,{Prefer:'resolution='+(mode==='i'?'ignore':'merge')+'-duplicates,return=minimal'});
  }
  function done(r){if(r.del)delete ST.base[r.coll+'/'+r.id];else ST.base[r.coll+'/'+r.id]=r.h}
  function sendGroup(mode,rows){
    return sendRows(mode,rows).then(function(){rows.forEach(done)},function(e){
      if(!e.status||e.status>=500||e.status===401)throw e;
      var p=Promise.resolve();
      rows.forEach(function(r){p=p.then(function(){return sendRows(mode,[r]).then(function(){done(r)},function(e2){
        if(!e2.status||e2.status>=500||e2.status===401)throw e2;
        ST.rej.unshift({k:r.coll+'/'+r.id,msg:msg(e2),ts:Date.now()});ST.rej.length=Math.min(ST.rej.length,30);
        if(r.del)delete ST.base[r.coll+'/'+r.id];else ST.base[r.coll+'/'+r.id]=r.h})})});
      return p;
    });
  }
  function push(){
    var role=ST.auth.profile.role==='owner'?'o':'s',R=recs(),rows=[];
    Object.keys(R).forEach(function(k){var r=R[k],m=SPEC[r.coll][role];if(!m)return;
      if((r.coll==='stock'||r.coll==='istock')&&!api.stockDirty)return;
      if(ST.base[k]!==r.h){r.mode=m;rows.push(r)}});
    if(role==='o')Object.keys(ST.base).forEach(function(k){if(R[k])return;var c=k.slice(0,k.indexOf('/'));
      if(!TOMB[c])return;if((c==='stock'||c==='istock')&&!api.stockDirty)return;
      rows.push({coll:c,id:k.slice(c.length+1),pdv:null,data:{},del:true,mode:'u'})});
    rows.sort(function(a,b){return (PRIO[a.coll]!=null?PRIO[a.coll]:2)-(PRIO[b.coll]!=null?PRIO[b.coll]:2)});
    var groups=[];
    rows.forEach(function(r){var pr=PRIO[r.coll]!=null?PRIO[r.coll]:2,g=groups[groups.length-1];
      if(g&&g.mode===r.mode&&g.pr===pr&&g.rows.length<100&&r.coll!=='config'&&g.rows[0].coll!=='config')g.rows.push(r);else groups.push({mode:r.mode,pr:pr,rows:[r]})});
    var p=Promise.resolve();
    groups.forEach(function(g){p=p.then(function(){return sendGroup(g.mode,g.rows)})});
    return p.then(function(){api.stockDirty=false;writeSt()});
  }

  /* ----- réception ----- */
  function pull(){
    var a=ST.auth,uid=a.uid,cur=ST.cur[uid]||null,rows=[];
    function more(filter){return call('GET','/rest/v1/records?select=coll,id,pdv_id,data,deleted,updated_at&order=updated_at.asc&limit=1000'+filter).then(function(r){
      rows=rows.concat(r);if(r.length>=1000)return more('&updated_at=gt.'+encodeURIComponent(r[r.length-1].updated_at))})}
    var f=cur?'&updated_at=gte.'+encodeURIComponent(new Date(Date.parse(cur)-10000).toISOString()):'';
    return more(f).then(function(){
      var ch=applyAll(rows,a.profile.role==='owner');
      if(rows.length)ST.cur[uid]=rows[rows.length-1].updated_at;
      if(a.profile.role==='owner'&&!rows.length&&!cur&&!S.pdvs.length&&!S.products.length){seedCatalog();ch=true}
      writeSt();return ch});
  }
  function pullCatalog(){
    var rows=[];
    return call('GET','/rest/v1/records?select=coll,id,pdv_id,data,deleted,updated_at&coll=in.(products,ingredients,pdvs,config,stock,istock)&limit=5000').then(function(r){
      return applyAll(r,false)})}
  function seedCatalog(){api.stockDirty=true;var d=seed();S.pdvs=d.pdvs;S.ingredients=d.ingredients;S.products=d.products;brand();
    S.users=S.users||[];setTimeout(function(){toast('Catalogue de départ créé : modifiez-le dans Produits et Gestion.')},300)}
  function applyAll(rows,owner){
    if(!rows.length)return false;
    var cur=recs(),touched={},synced={},changed=false,unsent=pendCount()>0;
    var pass=rows.filter(function(r){return r.coll!=='stock'&&r.coll!=='istock'}).concat(rows.filter(function(r){return r.coll==='stock'||r.coll==='istock'}));
    pass.forEach(function(r){
      var k=r.coll+'/'+r.id,c=cur[k],isSt=r.coll==='stock'||r.coll==='istock';
      if(isSt){if((owner&&api.stockDirty)||unsent)return}
      else if(SPEC[r.coll][owner?'o':'s']){
        if(c&&ST.base[k]!==c.h)return;                       /* modification locale pas encore envoyée */
        if(!c&&ST.base[k]!==undefined&&!r.deleted)return;     /* suppression locale pas encore envoyée */
      }
      if(c&&!r.deleted&&(ARR0[r.coll]||c.h===cyrb53(stab(r.data)))){synced[k]=1;return}
      if(!c&&r.deleted)return;
      applyRec(r);touched[k]=1;changed=true;
    });
    var after=recs();
    rows.forEach(function(r){var k=r.coll+'/'+r.id;
      if(after[k]){if(touched[k]||synced[k])ST.base[k]=after[k].h}
      else if(r.deleted)delete ST.base[k]});
    if(changed){sortAll();rawSave()}
    if(changed&&owner&&rows.some(function(r){return r.coll==='customers'})&&mergeDuplicates())rawSave();
    return changed;
  }

  /* ----- cycle ----- */
  function idle(){var ae=document.activeElement;return !(ae&&/^(INPUT|TEXTAREA|SELECT)$/.test(ae.tagName))&&$('#modal').hidden&&!P}
  function run(){
    var fresh=!ST.cur[ST.auth.uid],chg=false,seller=ST.auth.profile.role==='seller';
    return ensureTok().then(checkProfile).then(function(){return fresh?pull():push()}).then(function(c){chg=c;return fresh?push():pull()}).then(function(c){chg=chg||c===true;return flushPins()})
      .then(function(c){chg=chg||c===true;if(seller&&!api.catDone){api.catDone=true;return pullCatalog().then(function(x){chg=chg||x})}})
      .then(function(){ST.last=Date.now();writeSt();setNet(true);return chg});
  }
  function cycle(force){
    if(busy)return busy;
    if(!ST.auth||(!U.user&&!force))return Promise.resolve();
    busy=run().then(function(ch){
      busy=null;if(ch||needRender){if(U.user&&idle()){needRender=false;if(window.dbg)dbg('affichage rafraichi (synchro)');render()}else needRender=true}
    },function(e){
      busy=null;
      if(e===HALT)return;
      if(!e.status){setNet(false);return}
      if(e.expired&&U.user){forceOut('Votre connexion a expiré. Reconnectez-vous avec Internet.');return}
      if(e.status>=500){setNet(false);return}
      console.warn('sync',e);
    });
    return busy;
  }
  function kick(ms){if(!SYNC_ON||!ST.auth)return;clearTimeout(timer);timer=setTimeout(function(){timer=null;cycle()},ms==null?1500:ms)}
  function start(){
    if(!SYNC_ON||api.started)return;api.started=true;
    setInterval(function(){if(document.visibilityState!=='hidden')cycle()},12000);
    document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible')kick(200)});
    kick(300);
  }
  function init(){
    if(!SYNC_ON)return;
    if(!S.sid||S.sid!==ST.sid){var keep={creds:ST.creds,auth:null};ST={v:1,sid:rid(),base:{},cur:{},creds:keep.creds||{},auth:null,rej:[],last:0};S=blank();S.sid=ST.sid;writeSt();rawSave()}
  }
  function settle(keys){var R=recs();keys.forEach(function(k){if(ST.base[k]!==undefined&&R[k])ST.base[k]=R[k].h});writeSt()}
  function flushPins(){
    var q=ST.pinq||{},ids=Object.keys(q);
    if(!ids.length||ST.auth.offline)return Promise.resolve();
    var p=Promise.resolve();
    ids.forEach(function(id){p=p.then(function(){return call('POST','/rest/v1/rpc/set_customer_pin',{p_cust:id,p_pin:q[id]}).then(function(){delete ST.pinq[id];writeSt()},function(e){
      if(!e.status||e.status>=500||e.status===401)throw e;
      if(/introuvable/i.test(e.message||''))return;          /* le client n'est pas encore arrivé sur le serveur : on réessaie au prochain échange */
      delete ST.pinq[id];writeSt()})})});
    return p;
  }
  function setPin(id,pin){ST.pinq=ST.pinq||{};ST.pinq[id]=pin;writeSt();kick(300)}
  function rpc(name,args){
    if(!ST.auth||ST.auth.offline||!U.online)return Promise.reject(nerr('Connexion internet requise.',0));
    return call('POST','/rest/v1/rpc/'+name,args||{});
  }
  function first(r){
    if(!r.online)return Promise.resolve();
    return run().catch(function(e){if(e===HALT)throw e;if(e.status&&e.status<500)throw e;});
  }
  function statusHTML(){
    var n=pendCount(),rj=ST.rej||[];
    return '<div class="item"><div class="grow muted">Dernier échange avec le serveur</div><b>'+(ST.last?ago(ST.last):'jamais')+'</b></div>'
      +'<div class="item"><div class="grow muted">Ventes en attente d’envoi</div><b class="num">'+n+'</b></div>'
      +(rj.length?'<div class="note bad" style="margin-top:8px"><b>'+rj.length+' élément(s) refusé(s) par le serveur</b><div class="small">'+esc(rj[0].k+' : '+rj[0].msg)+'</div></div>':'');
  }
  var api={ST:function(){return ST},setPin:setPin,login:login,logout:logout,first:first,kick:kick,start:start,init:init,settle:settle,rpc:rpc,profiles:profiles,msg:msg,
    pend:pendCount,statusHTML:statusHTML,cycle:function(){return cycle()},stockDirty:false,started:false,
    renamePhone:function(o,n){if(ST.creds[o]){ST.creds[n]=ST.creds[o];delete ST.creds[o]}if(ST.auth&&ST.auth.phone===o)ST.auth.phone=n;writeSt()},
    dirtyStock:function(){api.stockDirty=true;kick(400)},
    role:function(){return ST.auth&&ST.auth.profile?ST.auth.profile.role:null},
    hasAuth:function(uid){return !!(ST.auth&&ST.auth.uid===uid)}};
  return api;
})();

Sync.init();
if(!SYNC_ON)mergeDuplicates();
(function(){var se=S.session,u=se&&userById(se.uid);if(u&&(!SYNC_ON||Sync.hasAuth(se.uid))){U.lpdv=se.pdvId;startSession(u,true)}else S.session=null})();
render();
Sync.start();
})();
</script>
<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
